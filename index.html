What should she do to benefit from that experience?","rule":"Use lessons learned at the start, when they can still change the plan."},{"id":"b1-B7-01","d":"B","t":7,"a":"hy","type":"s","o":["Involve technicians in the rollout, explain what the system does for them, provide hands-on training, and support them through the transition","Set a cutover date and remove the paper forms","Report the technicians' attitude to their managers","Delay the project until the technicians are ready"],"c":[0],"x":["Adoption depends on people. Involvement, clear benefit, training, and support are the main elements of managing organizational change.","A forced cutover with no preparation leads to workarounds and resentment.","This treats resistance as misconduct, when it is a normal response that has to be managed.","Readiness is built through engagement. It does not arrive by waiting."],"q":"A project is introducing a new maintenance management system. Technicians who have used paper work orders for twenty years are openly skeptical. The system itself works well. What should the project manager do?","rule":"A project delivers value only when people adopt the result. Plan for the people side of change."},{"id":"b1-B7-02","d":"B","t":7,"a":"pr","type":"s","o":["Assess the organization's culture and adapt the project's governance and communication to fit it while meeting project needs","Put in place the formal processes from her previous company, since they are proven","Drop all formal process to match the culture","Ask the sponsor to change the company culture"],"c":[0],"x":["Culture shapes how projects succeed. An approach that ignores it will meet resistance whatever its technical merit.","Processes proven elsewhere may fail in a different culture. Tailoring is required.","The project still needs enough control. Tailoring means fitting the process to the setting.","Changing culture is far outside the scope of the project."],"q":"A project manager joins a company where decisions are made by consensus and documentation is light. Her previous company used strict hierarchy and formal sign-offs. How should she approach the new project?","rule":"Assess the culture first, then tailor the approach to it."},{"id":"b1-B7-03","d":"B","t":7,"a":"ag","type":"s","o":["Assess the impact on the project and work with the sponsor to fill the product owner role quickly","Act as product owner in addition to current duties","Let the team prioritize the backlog itself","Pause the project until the reorganization settles"],"c":[0],"x":["An organizational change has removed a critical role. The project manager assesses the impact and acts with the sponsor to restore decision making.","The roles have different accountabilities, and combining them removes a balance between value and delivery.","The team does not have the business authority to decide on value.","Pausing may be premature. A timely replacement keeps the project moving."],"q":"A company reorganizes midway through a project, and the product owner is moved to another division. No replacement has been named. What should the project manager do first?","rule":"When the organization changes, assess the impact on the project and act with the sponsor."},{"id":"b1-B7-04","d":"B","t":7,"a":"hy","type":"m","o":["Identify change champions in each affected group to help their colleagues","Assess readiness before go-live and address gaps in skills and support","Keep the details confidential until go-live to avoid early resistance","Measure success only by whether the system went live on time","Send a single announcement email the day before go-live"],"c":[0,1],"x":["Peers who support the change are more convincing than project communications and can give local help.","A readiness assessment shows where adoption is likely to fail while there is still time to act.","Surprise increases resistance. People need time and information to prepare.","On time go-live does not mean the change was adopted or that benefits followed.","One late message is not change management."],"q":"A project will change how 500 employees do their daily work. Which two actions support adoption? (Choose two)","rule":"Adoption needs champions, readiness checks, training, and communication that starts early."},{"id":"b1-B8-01","d":"B","t":8,"a":"hy","type":"s","o":["Assess the effect on cost, schedule, and the business case, and bring options to the sponsor","Wait to see whether the tariffs are reversed","Order a full supply of components immediately","Ignore it, since tariffs are outside the project's control"],"c":[0],"x":["External changes are evaluated for their effect on the project and its value. Options might include early purchase, another supplier, or a revised budget.","The tariff has a date. Waiting uses up the time available to respond.","This may be the right choice, but committing the money without analysis or approval is not the project manager's call alone.","The cause is outside the project's control, but the response is within it."],"q":"A project is developing a product that uses a component from one foreign supplier. New tariffs on that component are announced, effective in 90 days. What should the project manager do?","rule":"Watch the external environment. When it changes, assess the impact on scope, cost, and value, then recommend."},{"id":"b1-B8-02","d":"B","t":8,"a":"ag","type":"s","o":["Bring the information to the product owner so the backlog and approach can be reassessed against value","Continue building, since half the work is already done","Tell the team to switch to the AI service at once","Keep the information from the team so it stays focused"],"c":[0],"x":["New technology can change the best way to deliver value. The product owner, with the team's input, decides whether to change direction.","Money already spent is sunk. The decision depends on future cost and value.","The decision needs evaluation and belongs to the product owner with the team.","Withholding relevant information goes against transparency and may waste the organization's money."],"q":"A team is halfway through building a customer chat feature when a new AI service appears on the market that could provide most of the functionality at low cost. What should the project manager do?","rule":"Keep scanning for technology and market changes. Reassess the backlog on future value and ignore sunk cost."},{"id":"b1-B8-03","d":"B","t":8,"a":"pr","type":"s","o":["Review regulatory, market, technology, and political factors at regular intervals and update the risk register and plans","Review external factors once, during planning","Rely on the sponsor to mention any relevant changes","Deal with external changes when they turn into issues"],"c":[0],"x":["Periodic scanning of the environment turns external surprises into risks that can be managed.","Two years is long enough for regulations, markets, and technology to move.","The sponsor may not know what is relevant to the project's detail. Monitoring is the project manager's responsibility too.","By then the options are fewer and more expensive."],"q":"A project manager on a two year infrastructure project wants to stay ahead of external changes that could affect it. What is the best practice?","rule":"Review the external environment on a regular schedule over the life of the project."},{"id":"b1-B8-04","d":"B","t":8,"a":"hy","type":"s","o":["Work with the product owner or sponsor to assess the impact of reprioritizing and decide based on value and feasibility","Move the feature up at once to respond to the market","Decline, because the roadmap is approved","Ask the team to work overtime to add the feature without moving anything else"],"c":[0],"x":["The market has changed and the request may be valid. It needs an impact assessment and a decision by the person who owns priority.","Acting without assessment may delay the first release or displace more valuable work.","Roadmaps exist to serve value. Refusing a market driven review is too rigid.","This hides the trade-off and is not sustainable."],"q":"A competitor launches a product with a feature that the project's product will not have until its third release. Sales asks for the feature to be moved into the first release. What should the project manager do?","rule":"External change leads to an impact assessment and then a prioritization decision by the value owner."},{"id":"b1-B4-06","d":"B","t":4,"a":"hy","type":"s","o":["Bring both vendors and the technical leads together to find the root cause and agree on a resolution and who carries it out","Tell both vendors to fix their products at their own cost","Have the project team build an adapter without involving the vendors","Wait for one of the vendors to propose a fix"],"c":[0],"x":["Issues that cross party lines need the relevant stakeholders working on the facts together. Any commercial question follows once the cause is known.","Without a root cause, neither vendor is shown to be at fault and both will resist.","This may hide a defect a vendor is obliged to fix, and it adds unplanned scope.","Each has already denied responsibility. Waiting extends the delay."],"q":"During integration, a team finds that two subsystems built by different vendors cannot exchange data. Each vendor says its product meets its specification. The project manager has logged the issue. What should be done next?","rule":"Resolve issues with the stakeholders who are involved. Find the root cause before discussing who pays."}],"cases":{"b1-C1":{"title":"Pump station upgrade, status at the end of month 6","text":"A predictive project to upgrade a municipal pump station has a budget at completion (BAC) of 1,200,000 dollars and a planned duration of 12 months. At the end of month 6 the project manager pulls these figures from the cost system:\n\nPlanned value (PV): 600,000 dollars\nEarned value (EV): 540,000 dollars\nActual cost (AC): 600,000 dollars\n\nThe sponsor has asked for a status summary and a forecast. The cause of the variance is lower than planned labor productivity on the piping work, which the site lead expects to continue."},"b1-C2":{"title":"Cooling retrofit, risk review before procurement","text":"A project manager is preparing the risk section of a plan for a data center cooling retrofit. The team has quantified three risks:\n\nRisk A, late chiller delivery: 30 percent probability, cost impact of 200,000 dollars.\nRisk B, permit delay: 20 percent probability, cost impact of 150,000 dollars.\nRisk C, an opportunity to win a utility efficiency rebate: 50 percent probability, benefit of 80,000 dollars.\n\nThe chiller supplier has offered a guaranteed early production slot for an extra 45,000 dollars, which would remove Risk A."}}}</script>
<script>"use strict";
/* ---------- data ---------- */
const BANK = JSON.parse(document.getElementById("bank").textContent);
const DOM = { P: { name: "People", w: 0.33 }, R: { name: "Process", w: 0.41 }, B: { name: "Business environment", w: 0.26 } };
const APPR = { pr: "Predictive", ag: "Agile", hy: "Hybrid" };
const TASKS = {
  P: ["Develop a common vision", "Manage conflicts", "Lead the project team", "Engage stakeholders", "Align stakeholder expectations", "Manage stakeholder expectations", "Help ensure knowledge transfer", "Plan and manage communication"],
  R: ["Integrated plan and delivery planning", "Develop and manage scope", "Help ensure value-based delivery", "Plan and manage resources", "Plan and manage procurement", "Plan and manage finance", "Plan and optimize quality", "Plan and manage schedule", "Evaluate project status", "Manage project closure"],
  B: ["Define and establish governance", "Plan and manage compliance", "Manage and control changes", "Remove impediments and manage issues", "Plan and manage risk", "Continuous improvement", "Support organizational change", "Evaluate external environment changes"]
};
const SEG = [
  { name: "Review missed", min: 10 },
  { name: "New questions", min: 35 },
  { name: "Weak-task drill", min: 15 }
];
const GOAL_SEC = 3600;
const INTERVALS = [1, 3, 7, 14, 30];
const FULL_MOCK_MIN_BANK = 600;
const LS_KEY = "pmpdaily.v1";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, "0");
function dayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dayNum(d) { d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(s); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(c, n) { return n ? Math.round((100 * c) / n) : 0; }

/* ---------- state ---------- */
function freshState() {
  return { meta: { v: 1, ts: 0, days: {}, flags: {}, mocks: [], examDate: "", daily: { day: "", seg: 0, segSec: [0, 0, 0], extra: 0, done: false } }, cards: {}, ai: [] };
}
let S = loadLocal();
let QMAP = {};
function rebuildMap() { QMAP = {}; for (const q of BANK.questions) QMAP[q.id] = q; for (const q of S.ai) QMAP[q.id] = q; }
function allQ() { return BANK.questions.concat(S.ai); }

function loadLocal() {
  try {
    const t = localStorage.getItem(LS_KEY);
    if (t) { const o = JSON.parse(t), f = freshState(); return { meta: Object.assign(f.meta, o.meta || {}), cards: o.cards || {}, ai: o.ai || [] }; }
  } catch (e) { /* storage unavailable */ }
  return freshState();
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------- account sync (db capability), optional ---------- */
const R = { base: null, status: "device", dirty: new Set(), writing: false, timer: null };
let SAMPLE = null;
function chunkOf(id) { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return "k" + (h % 8); }
function markDirty(key) {
  if (key === "meta") S.meta.ts = Date.now();
  R.dirty.add(key); saveLocal();
  if (!R.base) return;
  clearTimeout(R.timer); R.timer = setTimeout(flush, 1500);
}
function writeKey(key) {
  if (key === "meta") return R.base.set(clone(S.meta));
  if (key === "ai") return R.base.collection("ai").doc("pool").set({ list: clone(S.ai) });
  const out = {};
  for (const id in S.cards) if (chunkOf(id) === key) out[id] = S.cards[id];
  return R.base.collection("cards").doc(key).set({ cards: clone(out) });
}
async function flush() {
  if (R.writing || !R.base) return;
  R.writing = true;
  try {
    while (R.dirty.size && R.base) {
      const key = R.dirty.values().next().value; R.dirty.delete(key);
      try { await writeKey(key); }
      catch (e) {
        const code = e && e.code;
        if (code === "unavailable" || code === "resource_exhausted") { R.dirty.add(key); clearTimeout(R.timer); R.timer = setTimeout(flush, 8000); break; }
        if (code === "quota_exceeded" || code === "invalid_argument" || code === "transform_error") { break; }
        R.base = null; R.status = "device"; break;
      }
    }
  } finally { R.writing = false; }
}
function mergeRemote(metaSnap, cardSnaps, aiSnap) {
  if (metaSnap && metaSnap.exists) {
    const rm = clone(metaSnap.data()), lm = S.meta; let localNewer = (lm.ts || 0) > (rm.ts || 0);
    for (const k in rm.days || {}) { const l = lm.days[k], v = rm.days[k]; if (!l) lm.days[k] = v; else { if ((l.sec || 0) > (v.sec || 0) || (l.n || 0) > (v.n || 0)) localNewer = true; lm.days[k] = { sec: Math.max(l.sec || 0, v.sec || 0), n: Math.max(l.n || 0, v.n || 0), c: Math.max(l.c || 0, v.c || 0) }; } }
    lm.flags = Object.assign({}, rm.flags || {}, lm.flags || {});
    const seen = new Set((lm.mocks || []).map((m) => m.ts));
    for (const m of rm.mocks || []) if (!seen.has(m.ts)) lm.mocks.push(m);
    lm.mocks.sort((a, b) => a.ts - b.ts);
    if ((rm.ts || 0) > (lm.ts || 0)) { lm.examDate = rm.examDate || ""; if (rm.daily) lm.daily = Object.assign(freshState().meta.daily, rm.daily); }
    if (localNewer) R.dirty.add("meta");
  } else if (S.meta.ts) R.dirty.add("meta");
  const remoteIds = new Set();
  for (const d of cardSnaps) {
    const body = d.data() || {}, cards = body.cards || {};
    for (const id in cards) { remoteIds.add(id); const rc = cards[id], lc = S.cards[id]; if (!lc || (rc.ts || 0) > (lc.ts || 0)) S.cards[id] = clone(rc); else if ((lc.ts || 0) > (rc.ts || 0)) R.dirty.add(chunkOf(id)); }
  }
  for (const id in S.cards) if (!remoteIds.has(id)) R.dirty.add(chunkOf(id));
  if (aiSnap && aiSnap.exists) {
    const list = (aiSnap.data() || {}).list || [], remote = new Set(list.map((q) => q.id)), have = new Set(S.ai.map((q) => q.id));
    if (S.ai.some((q) => !remote.has(q.id))) R.dirty.add("ai");
    for (const q of list) if (!have.has(q.id)) S.ai.push(clone(q));
  } else if (S.ai.length) R.dirty.add("ai");
}
async function initRemote() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("sample").then((s) => { SAMPLE = s || null; if (!X) render(); }).catch(() => {});
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const base = db.doc("data/users/" + uid + "/pmp");
    const [m, cs, ai] = await Promise.all([base.get(), base.collection("cards").get(), base.collection("ai").doc("pool").get()]);
    R.base = base;
    mergeRemote(m, cs.docs || [], ai);
    rebuildMap(); saveLocal();
    R.status = "account";
    if (R.dirty.size) flush();
    if (!X) render();
  } catch (e) { R.base = null; R.status = "device"; }
}

/* ---------- stats ---------- */
function today() { const k = dayKey(); if (!S.meta.days[k]) S.meta.days[k] = { sec: 0, n: 0, c: 0 }; return S.meta.days[k]; }
function todaySec() { const d = S.meta.days[dayKey()]; return d ? d.sec || 0 : 0; }
function streak() {
  let n = 0; const d = new Date();
  if ((S.meta.days[dayKey(d)] || {}).sec >= GOAL_SEC) n++;
  for (;;) { d.setDate(d.getDate() - 1); if (((S.meta.days[dayKey(d)] || {}).sec || 0) >= GOAL_SEC) n++; else break; }
  return n;
}
function tally(keyFn) {
  const out = {};
  for (const id in S.cards) { const q = QMAP[id]; if (!q) continue; const k = keyFn(q); if (k == null) continue; const o = out[k] || (out[k] = { n: 0, c: 0 }); o.n++; if (S.cards[id].last) o.c++; }
  return out;
}
function readiness() {
  const by = tally((q) => q.d); let total = 0, num = 0, den = 0;
  for (const d in DOM) { const o = by[d]; if (o) total += o.n; if (o && o.n >= 8) { num += DOM[d].w * (o.c / o.n); den += DOM[d].w; } }
  if (total < 30 || !den) return null;
  return Math.round((100 * num) / den);
}
function dueIds() { const t = dayNum(); return Object.keys(S.cards).filter((id) => QMAP[id] && S.cards[id].w && S.cards[id].due <= t).sort((a, b) => S.cards[a].due - S.cards[b].due); }
function missedIds() { return Object.keys(S.cards).filter((id) => QMAP[id] && S.cards[id].w && S.cards[id].box < 4); }
function weakTasks(k) {
  const by = tally((q) => q.d + q.t), rows = [];
  for (const d in TASKS) TASKS[d].forEach((_, i) => { const key = d + (i + 1), o = by[key] || { n: 0, c: 0 }; rows.push({ d, t: i + 1, n: o.n, acc: o.n ? o.c / o.n : null }); });
  const rated = rows.filter((r) => r.n >= 3 && r.acc < 0.8).sort((a, b) => a.acc - b.acc);

function startMock(size, minutes) {

  let ids = [];
  for (const d in want) ids = ids.concat(shuffle(vetted.filter((q) => q.d === d)).slice(0, want[d]).map((q) => q.id));

function newSession(o) { return Object.assign({ seen: new Set(), pending: [], cur: null, total: 0, correct: 0, sec: 0, log: [], started: Date.now(), confirmExit: false, report: false }, o); }

}
function takeId() {

  const dl = S.meta.daily;
  for (;;) {

    let id = null;

  let h = '<div class="stack-lg"><header class="stack"><h1 class="h1">Mock exam</h1><p class="sub">Timed, weighted 33/41/26 across the three domains, and no feedback until you submit. The real exam is 180 questions in 240 minutes with two 10 minute breaks.</p></header>';
  h += '<section class="panel stack"><h2 class="h2">Mini mock</h2><p class="sub">45 questions in 60 minutes, the same pace as the real exam.</p><button class="btn primary big" data-act="start-mock" data-n="45" data-m="60">Start mini mock</button></section>';
  h += '<section class="panel stack' + (unlocked ? "" : " lock") + '"><h2 class="h2">Full mock</h2><p class="sub">180 questions in 240 minutes. ' + (unlocked ? "" : "Unlocks when the reviewed bank reaches " + FULL_MOCK_MIN_BANK + " questions, so the mock does not recycle what you practiced. The bank has " + n + ".") + '</p><button class="btn big" data-act="start-mock" data-n="180" data-m="240"' + (unlocked ? "" : " disabled") + ">Start full mock</button></section>";
  if (S.meta.mocks.length) h += '<section class="stack"><h2 class="h2">History</h2><div class="list">' + S.meta.mocks.slice().reverse().map((m) => '<div class="item row between"><span>' + new Date(m.ts).toLocaleDateString() + '<span class="small"> ' + m.size + " questions, " + fmtClock(m.sec) + '</span></span><b class="num">' + m.score + "%</b></div>").join("") + "</div></section>";
  return h + "</div>";
}
function band(a) { return a == null ? "" : a < 0.6 ? " low" : a < 0.75 ? " mid" : " high"; }
function vProgress() {
  const rd = readiness(), byD = tally((q) => q.d), byT = tally((q) => q.d + q.t), byA = tally((q) => q.a);
  let attempts = 0, totalSec = 0; for (const id in S.cards) attempts += S.cards[id].n; for (const k in S.meta.days) totalSec += S.meta.days[k].sec || 0;
  let h = '<div class="stack-lg"><header class="stack"><h1 class="h1">Progress</h1></header>';
  h += '<section class="panel stack"><div class="row between"><h2 class="h2">Estimated readiness</h2><b class="h1 num">' + (rd == null ? "n/a" : rd + "%") + '</b></div><div class="meter"><i style="width:' + (rd || 0) + '%;background:var(--primary)"></i><span class="t"></span></div><p class="small">' + (rd == null ? "Shown after 30 answered questions. " : "") + "Weighted 33/41/26 by domain, using your latest answer to each question. The marker is 75 percent. PMI does not publish a pass mark, so treat 75 percent or higher on mocks as the point to book the exam.</p></section>";
  h += '<section class="panel stack"><h2 class="h2">By domain</h2>' + Object.keys(DOM).map((d) => { const o = byD[d] || { n: 0, c: 0 }; return '<div class="drow"><span><span class="dm ' + d + '"></span>' + DOM[d].name + ' <span class="small">' + Math.round(DOM[d].w * 100) + '% of exam</span></span><b class="num">' + (o.n ? pct(o.c, o.n) + "%" : "n/a") + '</b><div class="meter"><i style="width:' + pct(o.c, o.n) + "%;background:var(--" + ({ P: "people", R: "process", B: "biz" }[d]) + ')"></i><span class="t"></span></div></div>'; }).join("") + "</section>";
  h += '<section class="stack"><h2 class="h2">By task</h2><p class="small">Tap a task to practice it. Counts are questions answered.</p>';
  for (const d in TASKS) h += '<div class="tasks"><p class="small" style="margin-top:8px"><span class="dm ' + d + '"></span>' + DOM[d].name + "</p>" + TASKS[d].map((t, i) => { const o = byT[d + (i + 1)] || { n: 0, c: 0 }, a = o.n ? o.c / o.n : null; return '<button class="task' + (o.n >= 3 ? band(a) : "") + '" data-act="task-practice" data-k="' + d + (i + 1) + '"><span>' + esc(t) + '</span><span class="pct num">' + (o.n ? pct(o.c, o.n) + "%" : "n/a") + '<span class="cnt">' + o.n + " answered</span></span></button>"; }).join("") + "</div>";
  h += "</section>";
  h += '<section class="panel stack"><h2 class="h2">By approach</h2>' + Object.keys(APPR).map((a) => { const o = byA[a] || { n: 0, c: 0 }; return '<div class="drow"><span>' + APPR[a] + '</span><b class="num">' + (o.n ? pct(o.c, o.n) + "%" : "n/a") + '</b><div class="meter"><i style="width:' + pct(o.c, o.n) + '%;background:var(--ink)"></i></div></div>'; }).join("") + "</section>";
  // 14 day minutes chart
  const W = 700, H = 150, bw = W / 14; let bars = "";
  for (let i = 13; i >= 0; i--) { const dd = new Date(); dd.setDate(dd.getDate() - i); const mins = Math.min(90, ((S.meta.days[dayKey(dd)] || {}).sec || 0) / 60), x = (13 - i) * bw, bh = (mins / 90) * (H - 24); bars += '<rect x="' + (x + 6) + '" y="' + (H - 20 - bh) + '" width="' + (bw - 12) + '" height="' + Math.max(bh, 1) + '" rx="4" fill="' + (mins >= 60 ? "var(--amber)" : "var(--muted)") + '"/><text x="' + (x + bw / 2) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="12" fill="var(--muted)">' + dd.getDate() + "</text>"; }
  const gy = H - 20 - (60 / 90) * (H - 24);
  h += '<section class="panel stack"><div class="row between"><h2 class="h2">Minutes per day</h2><span class="small num">' + Math.round(totalSec / 3600) + " hours total, " + attempts + ' answers</span></div><svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Minutes studied per day over the last 14 days">' + bars + '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--ink)" stroke-dasharray="4 5"/><text x="' + (W - 2) + '" y="' + (gy - 5) + '" text-anchor="end" font-size="12" fill="var(--ink)">60 min goal</text></svg></section>';
  const flags = Object.keys(S.meta.flags || {}).length;
  h += '<section class="panel stack"><h2 class="h2">Settings</h2><label class="field"><span>Exam date</span><input type="date" data-chg="exam" value="' + esc(S.meta.examDate) + '"></label><p class="small">' + (R.status === "account" ? "Progress is saved to your Claude account and follows you across devices." : "Progress is saved in this browser only. It will sync to your Claude account when the connection is available.") + (flags ? " " + flags + " reported questions are waiting for Claude to review in chat." : "") + "</p>" +
    '<div id="resetbox">' + (RESET_ASK ? '<p class="notice warn">This erases all answers, streaks and mock results. It cannot be undone.</p><div class="row"><button class="btn" data-act="reset-yes">Erase everything</button><button class="btn quiet" data-act="reset-no">Keep my progress</button></div>' : '<button class="btn quiet" data-act="reset-ask">Reset all progress</button>') + "</div></section>";
  return h + "</div>";
}
let RESET_ASK = false;

function tagLine(q) { return '<div class="tags"><span><span class="dm ' + q.d + '"></span>' + DOM[q.d].name + "</span><span>" + esc(TASKS[q.d][q.t - 1]) + "</span><span>" + APPR[q.a] + "</span>" + (q.ai ? '<span class="ai">AI generated</span>' : "") + "</div>"; }
function caseBox(q, open) { if (!q.case || !BANK.cases[q.case]) return ""; const c = BANK.cases[q.case]; return '<details class="case"' + (open ? " open" : "") + "><summary>Case: " + esc(c.title) + '</summary><div class="body">' + esc(c.text) + "</div></details>"; }
function optionsHtml(cur, locked, reveal) {
  const q = cur.q, L = "ABCDE";
  if (q.type === "match") {
    return '<div class="opts">' + q.left.map((l, i) => { const sel = cur.msel[i], ok = sel === i; return '<div class="matchrow' + (reveal ? (ok ? " right" : " wrong") : "") + '"><div class="l">' + esc(l) + "</div>" + (reveal ? "<div>" + (ok ? "" : '<span class="small">Your answer: ' + esc(sel >= 0 ? q.right[sel] : "none") + "</span><br>") + "<b>" + esc(q.right[i]) + "</b></div>" : '<select data-chg="match" data-i="' + i + '"' + (locked ? " disabled" : "") + '><option value="-1">Choose a match</option>' + cur.rorder.map((r) => '<option value="' + r + '"' + (sel === r ? " selected" : "") + ">" + esc(q.right[r]) + "</option>").join("") + "</select>") + "</div>"; }).join("") + "</div>" + (reveal ? '<p class="why" style="padding-left:6px">' + esc(q.why) + "</p>" : "");
  }
  return '<div class="opts" role="group">' + cur.order.map((oi, k) => {
    const picked = cur.sel.has(oi), right = q.c.includes(oi);
    const cls = reveal ? (right ? " right" : picked ? " wrong" : " plain") : "";
    return '<div class="optwrap' + (reveal ? " done" : "") + cls + '"><button class="opt" data-act="pick" data-i="' + oi + '" aria-pressed="' + picked + '"' + (locked ? " disabled" : "") + '><span class="k">' + L[k] + "</span><span>" + esc(q.o[oi]) + "</span></button>" + (reveal ? '<p class="why"><b>' + (right ? "Correct. " : picked ? "Your pick. " : "Wrong. ") + "</b>" + esc(q.x[oi]) + "</p>" : "") + "</div>";
  }).join("") + "</div>";
}
function canSubmit(cur) { const q = cur.q; return q.type === "match" ? cur.msel.every((v) => v >= 0) : cur.sel.size === q.c.length; }
function reportBox(cur) {
  if (S.meta.flags[cur.q.id]) return '<p class="small">Reported. Claude will see this the next time the bank is updated in chat.</p>';
  if (!cur.report) return "";
  return '<div class="panel stack"><label class="field"><span>What is wrong with this question?</span><select id="rep"><option>The marked answer looks wrong</option><option>The wording is unclear</option><option>Two options both look right</option><option>Typo or formatting</option><option>Out of date for the 2026 exam</option></select></label><button class="btn" data-act="report-send">Send report</button></div>';
}
function vQuiz() {
  const cur = X.cur, q = cur.q, dl = S.meta.daily;
  const where = X.mode === "daily" ? SEG[Math.min(dl.seg, 2)].name : X.title;
  const count = X.queue ? (X.total + (cur.answered ? 0 : 1)) + " of " + X.size : "Question " + (X.total + (cur.answered ? 0 : 1));
  let h = '<div class="qtop"><div class="wrap"><button class="btn quiet" data-act="exit-ask" aria-label="Leave session">Leave</button><div class="where">' + esc(where) + '<span class="small num"> ' + count + '</span></div><div class="clock num" id="clock" title="Minutes studied today">' + fmtClock(todaySec()) + "</div></div>" +
    (X.mode === "daily" ? '<div class="wrap" style="padding-bottom:10px">' + planBar(true) + "</div>" : '<div class="qprog"><i style="width:' + (X.size ? (100 * X.total) / X.size : 0) + '%"></i></div>') + "</div>";
  h += '<div class="wrap stack" style="padding-top:20px">';
  if (X.confirmExit) h += '<div class="panel stack"><p><b>Leave this session?</b> Answers so far are saved.</p><div class="row"><button class="btn" data-act="exit-yes">Leave</button><button class="btn primary" data-act="exit-no">Keep going</button></div></div>';
  const firstOfCase = q.case && !X.log.some((l) => QMAP[l.id] && QMAP[l.id].case === q.case);
  h += caseBox(q, firstOfCase) + tagLine(q) + '<p class="stem">' + esc(q.q) + "</p>";
  if (q.type === "m" && !cur.answered) h += '<p class="small"><b>Choose ' + q.c.length + ".</b></p>";
  if (cur.answered) h += '<div class="verdict ' + (cur.correct ? "ok" : "no") + '" role="status">' + (cur.correct ? "Correct" : "Not the best answer") + "</div>";
  h += optionsHtml(cur, cur.answered, cur.answered);
  if (cur.answered) {
    h += '<div class="rule"><b>Rule to remember</b>' + esc(q.rule) + "</div>";
    if (!cur.correct) h += '<p class="small">This question returns tomorrow in your missed queue.</p>';
    if (cur.guessed) h += '<p class="small">Marked as a guess. It returns tomorrow in your missed queue.</p>';
    h += reportBox(cur);
    h += '<div class="qactions"><button class="btn primary" data-act="next">Next question</button>' + (cur.correct && !cur.guessed ? '<button class="btn" data-act="guessed">I guessed</button>' : "") + (S.meta.flags[q.id] || cur.report ? "" : '<button class="btn quiet" data-act="report">Report a problem</button>') + "</div>";
  } else h += '<div class="qactions"><button class="btn primary" data-act="check"' + (canSubmit(cur) ? "" : " disabled") + ">Check answer</button></div>";
  return h + "</div>";
}
function vMockQ() {
  const cur = X.cur, q = cur.q, n = X.slots.length;
  let h = '<div class="qtop"><div class="wrap"><button class="btn quiet" data-act="exit-ask">Leave</button><div class="where">' + esc(X.title) + '<span class="small num"> ' + (X.pos + 1) + " of " + n + '</span></div><div class="clock num" id="clock">' + fmtClock((X.endsAt - Date.now()) / 1000) + '</div></div><div class="qprog"><i style="width:' + (100 * (X.pos + 1)) / n + '%"></i></div></div><div class="wrap stack" style="padding-top:20px">';
  if (X.confirmExit) h += '<div class="panel stack"><p><b>Leave the mock?</b> It will be discarded and nothing is scored.</p><div class="row"><button class="btn" data-act="exit-yes">Discard mock</button><button class="btn primary" data-act="exit-no">Keep going</button></div></div>';
  if (X.confirmSubmit) { const blank = X.slots.filter((s) => (s.q.type === "match" ? !s.msel.some((v) => v >= 0) : !s.sel.size)).length; h += '<div class="panel stack"><p><b>Submit the mock?</b> ' + (blank ? blank + " questions are unanswered and will count as wrong." : "All questions are answered.") + '</p><div class="row"><button class="btn primary" data-act="submit-yes">Submit and score</button><button class="btn" data-act="submit-no">Back to questions</button></div></div>'; }
  if (X.overview) {
    h += '<h2 class="h2">Overview</h2><p class="small">Filled means answered. An amber edge means flagged.</p><div class="gridnav">' + X.slots.map((s, i) => { const a = s.q.type === "match" ? s.msel.some((v) => v >= 0) : s.sel.size > 0; return '<button class="num' + (a ? " ans" : "") + (X.flags.has(i) ? " flag" : "") + (i === X.pos ? " cur" : "") + '" data-act="goto" data-i="' + i + '">' + (i + 1) + "</button>"; }).join("") + '</div><div class="qactions"><button class="btn" data-act="overview">Back to question</button><button class="btn primary" data-act="submit-ask">Submit mock</button></div></div>';
    return h;
  }
  h += caseBox(q, true) + '<p class="stem">' + esc(q.q) + "</p>";
  if (q.type === "m") h += '<p class="small"><b>Choose ' + q.c.length + ".</b></p>";
  h += optionsHtml(cur, false, false);
  h += '<div class="qactions"><button class="btn" data-act="prev"' + (X.pos ? "" : " disabled") + '>Back</button><button class="btn" data-act="flag" aria-pressed="' + X.flags.has(X.pos) + '">' + (X.flags.has(X.pos) ? "Flagged" : "Flag") + '</button><button class="btn" data-act="overview">Overview</button>' + (X.pos < n - 1 ? '<button class="btn primary" data-act="fwd">Next</button>' : '<button class="btn primary" data-act="submit-ask">Submit mock</button>') + "</div></div>";
  return h;
}
function vResult() {
  let h = '<div class="qtop"><div class="wrap"><div class="where">' + esc(X.title) + '</div><button class="btn quiet" data-act="exit-yes">Done</button></div></div><div class="wrap stack-lg" style="padding-top:24px">';
  if (X.mode === "mock") {
    const r = X.result;
    h += '<header class="stack"><h1 class="h1 num">' + r.score + '% on this mock</h1><p class="sub">' + r.answered + " of " + X.slots.length + " answered in " + fmtClock(Math.min(X.limit, (Date.now() - X.started) / 1000)) + ". Misses have been added to your review queue.</p></header>";
    h += '<section class="panel stack">' + Object.keys(DOM).map((d) => { const o = r.byD[d] || [0, 0]; return '<div class="drow"><span><span class="dm ' + d + '"></span>' + DOM[d].name + '</span><b class="num">' + o[0] + "/" + o[1] + '</b><div class="meter"><i style="width:' + pct(o[0], o[1]) + "%;background:var(--" + ({ P: "people", R: "process", B: "biz" }[d]) + ')"></i><span class="t"></span></div></div>'; }).join("") + "</section>";
    h += '<section class="stack"><h2 class="h2">Review every question</h2><div class="list">' + X.slots.map((s, i) => '<details class="item"><summary><span class="mark ' + (s.blank ? "na" : s.correct ? "ok" : "no") + '">' + (s.blank ? "?" : s.correct ? "&#10003;" : "&#10005;") + '</span><span><span class="small num">' + (i + 1) + ". " + esc(TASKS[s.q.d][s.q.t - 1]) + "</span><br>" + esc(s.q.q.length > 110 ? s.q.q.slice(0, 110) + "..." : s.q.q) + '</span></summary><div class="stack" style="margin-top:14px">' + caseBox(s.q, false) + '<p class="stem">' + esc(s.q.q) + "</p>" + optionsHtml(s, true, true) + '<div class="rule"><b>Rule to remember</b>' + esc(s.q.rule) + "</div></div></details>").join("") + "</div></section>";
  } else {
    const dailyDone = X.mode === "daily" && S.meta.daily.done;
    h += '<header class="stack"><h1 class="h1">' + (dailyDone ? "Today's 60 minutes are done" : X.total ? "Session finished" : "Nothing left to ask") + '</h1><p class="sub num">' + (X.total ? X.correct + " of " + X.total + " correct (" + pct(X.correct, X.total) + "%) in " + fmtClock(X.sec) + ". " : "") + Math.floor(todaySec() / 60) + " minutes studied today.</p></header>";
    const miss = X.log.filter((l) => !l.ok);
    if (miss.length) h += '<section class="stack"><h2 class="h2">Missed in this session</h2><div class="list">' + miss.map((l) => { const q = QMAP[l.id]; return '<div class="item"><span class="small"><span class="dm ' + q.d + '"></span>' + esc(TASKS[q.d][q.t - 1]) + "</span><br>" + esc(q.rule) + "</div>"; }).join("") + '</div><p class="small">These come back tomorrow in the missed queue.</p></section>';
    h += '<div class="stack">' + (dailyDone ? '<button class="btn primary big" data-act="keep-going">Keep practicing new questions</button>' : "") + '<button class="btn big" data-act="exit-yes">Back to Today</button></div>';
  }
  return h + "</div>";
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, cur = X && X.cur;
  switch (a) {
    case "nav": if (X && !X.done) return; X = null; RESET_ASK = false; show(b.dataset.v); window.scrollTo(0, 0); break;
    case "start-daily": startDaily(); break;
    case "keep-going": { const ids = []; const skip = new Set(); for (let i = 0; i < 20; i++) { const id = pickNew(skip); if (!id) break; skip.add(id); ids.push(id); } startQueue(ids, "Extra practice", "practice"); break; }
    case "pf": { const g = b.dataset.g, k = b.dataset.k; if (g === "status") PF.status = k; else if (g === "count") PF.count = +k; else { PF[g].has(k) ? PF[g].delete(k) : PF[g].add(k); if (g === "doms" && PF.task && PF.doms.size && !PF.doms.has(PF.task[0])) PF.task = ""; } render(); break; }
    case "start-practice": startQueue(shuffle(practicePool()).slice(0, PF.count).map((q) => q.id), "Practice", "practice"); break;
    case "start-due": startQueue(dueIds(), "Review missed", "review"); break;
    case "start-missed": startQueue(shuffle(missedIds()), "Review missed", "review"); break;
    case "task-missed": startQueue(missedIds().filter((id) => QMAP[id].d + QMAP[id].t === b.dataset.k), "Review missed", "review"); break;
    case "task-practice": PF.doms = new Set([b.dataset.k[0]]); PF.task = b.dataset.k; PF.status = "all"; PF.apps = new Set(); show("practice"); window.scrollTo(0, 0); break;
    case "start-mock": startMock(+b.dataset.n, +b.dataset.m); break;
    case "ai-gen": genAI(); break;
    case "ai-stop": if (AI.ctl) AI.ctl.abort(); break;
    case "pick": {
      if (!cur || (cur.answered && X.mode !== "mock")) return; const i = +b.dataset.i, q = cur.q;
      if (q.type === "s") { cur.sel = new Set([i]); } else { if (cur.sel.has(i)) cur.sel.delete(i); else if (cur.sel.size < q.c.length) cur.sel.add(i); }
      const y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
    case "check": if (cur && !cur.answered && canSubmit(cur)) { grade(cur); render(); const v = $(".verdict"); if (v) v.scrollIntoView({ block: "start", behavior: "auto" }); window.scrollBy(0, -70); } break;
    case "next": nextQ(); break;
    case "guessed": markGuessed(cur); render(); break;
    case "report": cur.report = true; render(); break;
    case "report-send": { const sel = $("#rep"); S.meta.flags[cur.q.id] = { r: sel ? sel.value : "", ts: Date.now() }; cur.report = false; markDirty("meta"); render(); break; }
    case "exit-ask": X.confirmExit = true; render(); window.scrollTo(0, 0); break;
    case "exit-no": X.confirmExit = false; render(); break;
    case "exit-yes": exitSession(); window.scrollTo(0, 0); break;
    case "prev": if (X.pos > 0) { X.pos--; X.cur = X.slots[X.pos]; render(); window.scrollTo(0, 0); } break;
    case "fwd": if (X.pos < X.slots.length - 1) { X.pos++; X.cur = X.slots[X.pos]; render(); window.scrollTo(0, 0); } break;
    case "goto": X.pos = +b.dataset.i; X.cur = X.slots[X.pos]; X.overview = false; render(); window.scrollTo(0, 0); break;
    case "flag": X.flags.has(X.pos) ? X.flags.delete(X.pos) : X.flags.add(X.pos); render(); break;
    case "overview": X.overview = !X.overview; X.confirmSubmit = false; render(); window.scrollTo(0, 0); break;
    case "submit-ask": X.confirmSubmit = true; X.overview = false; render(); window.scrollTo(0, 0); break;
    case "submit-no": X.confirmSubmit = false; render(); break;
    case "submit-yes": finish(); break;
    case "reset-ask": RESET_ASK = true; render(); break;
    case "reset-no": RESET_ASK = false; render(); break;
    case "reset-yes": { const ai = S.ai; S = freshState(); S.ai = ai; RESET_ASK = false; rebuildMap(); markDirty("meta"); for (let i = 0; i < 8; i++) R.dirty.add("k" + i); saveLocal(); if (R.base) flush(); render(); break; }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-chg]"); if (!el) return;
  const k = el.dataset.chg;
  if (k === "task") { PF.task = el.value; render(); }
  else if (k === "exam") { S.meta.examDate = el.value; markDirty("meta"); }
  else if (k === "match" && X && X.cur) { const i = +el.dataset.i, v = +el.value; X.cur.msel[i] = v; const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener("keydown", (e) => {
  if (!X || VIEW !== "quiz" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const cur = X.cur; if (!cur || cur.q.type === "match") return;
  const idx = "12345".indexOf(e.key) >= 0 ? +e.key - 1 : "abcde".indexOf(e.key.toLowerCase());
  if (idx >= 0 && idx < cur.order.length && (!cur.answered || X.mode === "mock")) { const btn = document.querySelectorAll(".opt")[idx]; if (btn) btn.click(); }
  else if (e.key === "Enter" && X.mode !== "mock") { e.preventDefault(); const btn = $(cur.answered ? '[data-act="next"]' : '[data-act="check"]'); if (btn && !btn.disabled) btn.click(); }
});

rebuildMap();
render();
initRemote();
</script>
</body>

han a day","As scope creep caused by the customer"],"c":[0],"x":["Extras that were not requested add cost, test effort, and risk with no agreed value. The customer may not want them.","Customer satisfaction comes from delivering what was agreed. Unrequested features can cause defects and disputes.","Size does not matter. It is still scope outside the baseline.","The customer did not ask for it. Scope added by the team on its own initiative is gold plating."],"q":"A team member adds a small feature she is sure the customer will like. It was not requested and took only half a day. How should the project manager view this?","rule":"Deliver the agreed scope. Gold plating comes from the team. Scope creep comes from uncontrolled requests."},{"id":"b1-R2-05","d":"R","t":2,"a":"pr","type":"s","o":["Nominal group technique, where ideas are gathered individually and then ranked by voting","Open brainstorming with the whole group","Reviewing the hospital's existing documentation only","Asking the senior doctors to decide on behalf of all users"],"c":[0],"x":["Nominal group technique collects ideas from each participant and ranks them by vote, which reduces the influence of dominant voices.","Open brainstorming is where dominant participants take over.","Document analysis is useful but does not resolve conflicting needs among the groups.","This shuts out nurses and administrators, who use the system differently."],"q":"During requirements gathering for a hospital system, doctors, nurses, and administrators give conflicting requirements and sessions are dominated by a few senior doctors. Which technique would best help gather balanced input?","rule":"Use structured techniques such as nominal group or Delphi when some voices dominate."},{"id":"b1-R2-06","d":"R","t":2,"a":"ag","type":"m","o":["Scope is defined and refined progressively through the product backlog","Time and cost are often fixed while scope is flexed to fit","Scope is fully fixed before the first iteration begins","The team decides which features are in scope","Changes to the backlog require change control board approval"],"c":[0,1],"x":["The backlog evolves as the team and customer learn. Detailed scope is defined close to when the work is done.","Agile projects commonly fix the timebox and team and adjust scope to deliver the highest value within them.","That describes a predictive approach.","The product owner prioritizes features based on value. The team decides how much it can take on in a sprint.","Backlog changes are handled by the product owner through continuous reprioritization."],"q":"Which two statements about scope in an agile project are correct? (Choose two)","rule":"In agile, the backlog is the scope. It is expected to change, and the product owner owns its order."},{"id":"b1-R3-01","d":"R","t":3,"a":"ag","type":"s","o":["Select the smallest set of features that delivers usable value to customers, and release it to get feedback","Select the twelve features that are easiest to build","Build part of all forty features so every stakeholder sees progress","Wait for funding to cover all forty features before releasing"],"c":[0],"x":["A minimum viable product delivers value early and generates feedback that guides later releases.","Ease of building says nothing about value to the customer.","Forty partial features give the customer nothing usable.","This delays all value and all feedback."],"q":"A product owner must choose what goes into the first release of a mobile banking app. The backlog has forty features, and funding covers about twelve. What is the best basis for the choice?","rule":"Prioritize by value. Release the smallest usable product early and learn from it."},{"id":"b1-R3-02","d":"R","t":3,"a":"hy","type":"s","o":["Whether the work can be split into increments that each deliver usable value, such as one zone at a time","Whether the schedule can be crashed to one year","Whether the sponsor can be given more frequent status reports","Whether the business case can be revised to show earlier benefits"],"c":[0],"x":["Incremental delivery brings benefits forward, reduces risk, and gives feedback. The project manager should check whether the work allows it.","Crashing adds cost and may not be possible. It still delivers nothing until the end.","Reports are not value. The concern is about return on the investment.","Changing the document without changing delivery misleads the sponsor."],"q":"A two year project to modernize a warehouse will deliver all benefits at the end. The sponsor worries about waiting two years for any return. What should the project manager evaluate?","rule":"Look for ways to deliver value in increments, even on predictive work."},{"id":"b1-R3-03","d":"R","t":3,"a":"ag","type":"s","o":["The product owner reassesses the backlog order in light of the new information","The team adds the feature to the current sprint immediately","The project manager submits the request to a change control board","The request is declined because the roadmap was already agreed"],"c":[0],"x":["Agile welcomes changing priorities when they reflect value. The product owner owns the backlog and reorders it for upcoming sprints.","The current sprint's scope is protected. The change goes into the backlog for the next planning session unless the product owner cancels the sprint.","A change control board is a predictive control. Backlog priority is the product owner's decision.","The roadmap is a forecast. Refusing market driven change defeats the purpose of working iteratively."],"q":"During a sprint review, a key customer says a feature scheduled for three months from now has become urgent because a competitor just released something similar. What should happen?","rule":"New information changes the backlog, and the product owner decides. The current sprint stays stable."},{"id":"b1-R3-04","d":"R","t":3,"a":"pr","type":"s","o":["That a way of measuring the benefits is in place and someone in operations owns tracking them","That the benefits have been fully realized","That the business case is archived with the project records","That the project team will stay assigned to measure benefits"],"c":[0],"x":["Benefits arrive after the project ends. The project manager makes sure a measurement system and an owner exist so the organization can confirm the value.","Benefits from energy savings accrue over years and cannot be fully realized at closure.","Archiving is part of closure, but it does nothing to track whether benefits arrive.","The team is released at closure. Benefit tracking belongs to operations or the business owner."],"q":"A project's business case projects benefits of 2 million dollars per year from reduced energy use after a plant upgrade. The project is close to completion. What should the project manager verify before closure?","rule":"Before closing, confirm the benefits measurement plan and its owner. Benefits are realized after handover."},{"id":"b1-R3-05","d":"R","t":3,"a":"ag","type":"s","o":["Feature B","Feature C","Feature A","All three in parallel"],"c":[0],"x":["B scores 5 divided by 2, or 2.5. C scores 1.5 and A scores 1.0. B gives the most value for the effort.","C has the highest raw value but scores 1.5, below B's 2.5.","A scores 1.0, the lowest of the three.","Working on everything at once delays all value and raises work in progress."],"q":"A team is deciding the order of three features. Feature A has a business value of 8 and effort of 8. Feature B has value 5 and effort 2. Feature C has value 9 and effort 6. Using value divided by effort, which should be built first?","rule":"Simple prioritization: value divided by effort. Highest ratio first."},{"id":"b1-R3-06","d":"R","t":3,"a":"hy","type":"s","o":["Review the business case with the sponsor to decide whether the project should continue, change, or stop","Continue, because schedule and budget performance are good","Speed up delivery to reach the market sooner","Add features to differentiate the product from the competitor"],"c":[0],"x":["A project on time and on budget can still fail to deliver value. When the business justification changes, the sponsor needs to decide on its future.","Performance against baselines does not prove the project is still worth doing.","Faster delivery of a product with no market does not help.","This is a scope decision that needs business analysis and sponsor approval first."],"q":"Six months into a project, market data shows that the product's main feature is now offered free by a competitor. The project is on schedule and on budget. What should the project manager do?","rule":"Examine business value throughout the project. If the justification weakens, take it to the sponsor."},{"id":"b1-R3-07","d":"R","t":3,"a":"ag","type":"m","o":["MoSCoW, which sorts items into must have, should have, could have, and will not have","Kano analysis, which separates basic needs from performance features and delighters","Critical path method","Control charts","Resource leveling"],"c":[0,1],"x":["MoSCoW gives stakeholders a shared vocabulary for priority.","Kano shows which features customers take for granted, which raise satisfaction in proportion, and which surprise them.","The critical path method finds the longest path through a schedule network. It does not rank value.","Control charts monitor process stability. They belong to quality control.","Resource leveling adjusts a schedule to fit resource limits."],"q":"Which two techniques help a product owner prioritize a backlog by value? (Choose two)","rule":"Value prioritization tools include MoSCoW, Kano, relative weighting, and 100 point voting."},{"id":"b1-R4-01","d":"R","t":4,"a":"pr","type":"s","o":["Negotiate with the functional manager and the other project manager for the analyst's time or an alternative","Escalate to the sponsor to have the analyst reassigned","Hire an outside consultant immediately","Delay the critical path work until the analyst is free"],"c":[0],"x":["In a matrix organization, resources are obtained by negotiation. The project manager should try this before escalating or spending money.","Escalation is available if negotiation fails. It should not be the first step.","This may be the answer, but it has cost and approval implications and should follow an attempt to use internal resources.","Delaying critical path work delays the project. Alternatives should be explored first."],"q":"A project needs a structural analyst for six weeks starting next month. The only analyst in the company is assigned to another project during that period. The work is on the critical path. What should the project manager do first?","rule":"Resource conflicts: negotiate first, look at alternatives, then escalate."},{"id":"b1-R4-02","d":"R","t":4,"a":"ag","type":"s","o":["Work with the team and product owner to reduce sprint commitments to a level the team can sustain","Praise the team's commitment and keep the current pace until release","Add four new developers to spread the load","Replace the two members who asked for transfers"],"c":[0],"x":["Agile calls for a sustainable pace. Overwork raises defects and turnover, which lowers delivery in the end.","The signs of burnout are already visible. Continuing will cost more than it gains.","Adding people mid project reduces productivity in the short term and does not fix overcommitment.","This treats the symptom and loses experienced people."],"q":"An agile team has been working evenings and weekends for three sprints to meet commitments. Defects are rising and two members have asked for transfers. What should the project manager do?","rule":"Sustainable pace is an agile principle. Match commitments to real capacity."},{"id":"b1-R4-03","d":"R","t":4,"a":"pr","type":"s","o":["Resource smoothing, moving activities within their float so the completion date is unchanged","Crashing the March activities","Fast tracking the April activities into March","Resource leveling, accepting a later completion date"],"c":[0],"x":["Smoothing adjusts activities within available float to even out demand without changing the critical path or end date.","Crashing adds resources to shorten duration. It would make the March peak worse.","This would add to the March overload.","Leveling can change the critical path and delay the end date. Since float is available, smoothing solves it without delay."],"q":"A resource histogram shows that the electrical designers are scheduled for 60 hours a week in March and 10 hours a week in April. The affected activities have float. What technique should the project manager use?","rule":"Smoothing uses float and keeps the end date. Leveling may move the end date."},{"id":"b1-R4-04","d":"R","t":4,"a":"hy","type":"s","o":["Coordinate with the lab manager and the other project managers to agree on booking rules and priorities","Book the lab for twice the time needed as a precaution","Record each delay in the issue log and continue","Build a separate lab for the project"],"c":[0],"x":["The resource is shared, so the solution has to be shared. Agreed rules make availability predictable.","This harms the other projects and invites them to do the same.","Logging is needed, but without action the delays will continue.","The cost is out of proportion to a coordination problem."],"q":"A project relies on a shared testing lab that serves five projects. The lab's schedule often changes with little notice and has delayed the project twice. What should the project manager do?","rule":"Shared resources need coordination across projects. Work with the resource owner."},{"id":"b1-R4-05","d":"R","t":4,"a":"pr","type":"m","o":["Resource breakdown structure","Resource calendar","Requirements traceability matrix","Probability and impact matrix","Cost of quality analysis"],"c":[0,1],"x":["It shows resources by category and type, which supports planning and acquisition.","It shows when specific resources are available to the project.","This links requirements to deliverables and tests. It is a scope tool.","This ranks risks. It is a risk tool.","This weighs prevention and appraisal costs against failure costs. It is a quality tool."],"q":"Which two documents help a project manager plan and manage team resources? (Choose two)","rule":"Resource tools: RBS, resource calendars, RACI, and the resource management plan."},{"id":"b1-R5-01","d":"R","t":5,"a":"pr","type":"s","o":["Firm fixed price","Cost plus fixed fee","Time and materials","Cost plus incentive fee"],"c":[0],"x":["With well defined scope, a firm fixed price contract sets one price and puts the cost risk on the seller.","Cost reimbursable contracts put cost risk on the buyer and suit poorly defined scope.","Time and materials contracts suit small or undefined work and leave the buyer exposed to open ended cost.","The buyer still pays actual costs and carries most of the cost risk."],"q":"A buyer needs a custom treatment system built. The scope is well defined, with detailed specifications and drawings. The buyer wants the seller to carry the cost risk. Which contract type fits best?","rule":"Defined scope calls for fixed price, with risk on the seller. Unclear scope calls for cost reimbursable, with risk on the buyer. Time and materials is for small or urgent work."},{"id":"b1-R5-02","d":"R","t":5,"a":"hy","type":"s","o":["A master agreement with fixed terms, plus separate statements of work for each release or increment","A single firm fixed price contract for the full scope","A purchase order for the first month only","No contract, to preserve agility"],"c":[0],"x":["Fixed terms sit in the master agreement while scope is agreed increment by increment, which keeps flexibility and limits each party's exposure.","Fixed price on changing scope leads to constant change orders and disputes.","This gives no framework for an 18 month relationship.","Working with no agreement exposes both parties to legal and financial risk."],"q":"A company will use an outside firm for software development over 18 months. Requirements will change as users give feedback. Which contracting approach is most suitable?","rule":"Agile contracting: fixed terms in a master agreement, flexible scope in incremental work orders."},{"id":"b1-R5-03","d":"R","t":5,"a":"pr","type":"s","o":["Review the contract terms and the record of submittal and approval dates","Apply the liquidated damages, since the delivery was late","Waive the damages to keep the supplier relationship healthy","Refer the matter to the legal department for litigation"],"c":[0],"x":["Entitlement depends on what the contract says and what the records show. The facts come before any position is taken.","If the buyer caused the delay, the supplier may be entitled to a time extension. Acting without checking risks a dispute the buyer would lose.","Giving up a contractual right without analysis may cost the buyer money it is owed.","Contract disputes start with the facts and negotiation. Litigation is the last resort."],"q":"A supplier delivers fiberglass vessels two weeks late. The contract includes liquidated damages for late delivery. The supplier says the delay was caused by the buyer's late approval of drawings. What should the project manager do first?","rule":"In any procurement dispute, read the contract and check the records first. Negotiate before escalating."},{"id":"b1-R5-04","d":"R","t":5,"a":"pr","type":"s","o":["510,000 dollars","500,000 dollars","550,000 dollars","490,000 dollars"],"c":[0],"x":["The underrun is 50,000. The seller's 20 percent share is 10,000, so the fee is 60,000. Actual cost of 450,000 plus fee of 60,000 equals 510,000.","This is the target cost. It ignores actual cost and the fee.","This is target cost plus target fee, which applies only if actual cost equals the target.","This adds 40,000 to actual cost, which mistakenly gives the seller the buyer's 80 percent of the 50,000 underrun and drops the target fee."],"q":"A cost plus incentive fee contract has a target cost of 500,000 dollars, a target fee of 50,000 dollars, and a share ratio of 80/20 (buyer/seller). The actual cost is 450,000 dollars. What is the total amount paid to the seller?","rule":"CPIF: final fee equals target fee plus seller share times (target cost minus actual cost). Payment equals actual cost plus final fee."},{"id":"b1-R5-05","d":"R","t":5,"a":"pr","type":"s","o":["Decline, keep the bid information confidential, and follow the organization's procurement procedure","Share the prices to get the best deal for the company","Share a price range without naming the competitors","Remove that supplier from the bidding without telling anyone"],"c":[0],"x":["Sharing competitor prices is unethical and may be illegal. All bidders must be treated the same.","A lower price does not justify breaking procurement rules and fairness to the other bidders.","This still gives one bidder an unfair advantage.","Disqualification may be warranted, but it should follow the procurement procedure, with documentation."],"q":"Three suppliers have submitted proposals. One of them calls the project manager privately to ask what the other prices were, offering a discount if told. What should the project manager do?","rule":"Procurement integrity: treat bidders equally, keep bids confidential, follow the procedure."},{"id":"b1-R5-06","d":"R","t":5,"a":"hy","type":"s","o":["Review actual progress against the contract milestones with the vendor, including a visit or inspection if the contract allows","Accept the reports, since the vendor is responsible for delivery","Terminate the contract for nonperformance","Withhold payment until delivery"],"c":[0],"x":["A progress figure that does not move suggests a problem. Verifying against objective milestones shows the real status while there is still time to act.","The buyer's project still fails if the vendor fails. Monitoring vendor performance is the project manager's job.","The delivery date has not passed and no breach is established. Termination is premature.","Payment terms are set by the contract. Withholding payment without grounds may itself be a breach."],"q":"A key vendor's weekly progress reports have shown 90 percent complete for four weeks. The delivery date is six weeks away. What should the project manager do?","rule":"Monitor suppliers against objective milestones. Verify when reports stop making sense."},{"id":"b1-R5-07","d":"R","t":5,"a":"pr","type":"match","left":["Request for information","Request for quotation","Request for proposal","Statement of work","Source selection criteria"],"right":["Learn what suppliers can offer before defining the purchase","Get prices for a well defined standard item","Get a technical and commercial solution to a described need","Describe the work the seller must perform","Define how proposals will be scored"],"q":"Match each procurement document to its purpose.","why":"An RFI gathers market information. An RFQ asks for price when the item is fully specified. An RFP asks the seller how they would solve the problem. The statement of work defines what is bought, and selection criteria are set before bids arrive so evaluation is fair.","rule":"RFI is information, RFQ is price, RFP is a solution. Set selection criteria before proposals come in."},{"id":"b1-R9-01","d":"R","t":9,"a":"pr","type":"s","o":["Over budget and behind schedule, with CPI of 0.90 and SPI of 0.90","On budget and behind schedule, because AC equals PV","Under budget and behind schedule, with CV of plus 60,000 dollars","Over budget and ahead of schedule"],"c":[0],"x":["CPI is EV divided by AC, 540 over 600, or 0.90. SPI is EV divided by PV, also 0.90. Both below 1.0 mean over budget and behind schedule.","AC equal to PV says spending matches the spending plan. It says nothing about the work earned. Cost status compares EV with AC.","CV is EV minus AC, which is minus 60,000. The sign is negative, so the project is over budget.","SV is EV minus PV, which is minus 60,000. Negative means behind schedule."],"case":"b1-C1","q":"Based on the month 6 figures, which statement describes the project's status?","rule":"Always start from EV. CV equals EV minus AC, SV equals EV minus PV, CPI equals EV over AC, SPI equals EV over PV. Negative or below 1 is bad."},{"id":"b1-R6-01","d":"R","t":6,"a":"pr","type":"s","o":["About 1,333,000 dollars","1,260,000 dollars","1,200,000 dollars","1,080,000 dollars"],"c":[0],"x":["When the current variance is expected to continue, EAC equals BAC divided by CPI, which is 1,200,000 divided by 0.90, or about 1,333,000.","This is AC plus BAC minus EV, which assumes the remaining work will be done at the planned rate. The case says low productivity will continue.","This is the original budget and ignores performance to date.","This is BAC times CPI. The formula divides by CPI."],"case":"b1-C1","q":"The sponsor asks for the estimate at completion, assuming current cost performance continues. What should the project manager report?","rule":"Choose the EAC formula from the scenario. Typical variance: BAC over CPI. Atypical variance: AC plus BAC minus EV."},{"id":"b1-R6-02","d":"R","t":6,"a":"pr","type":"s","o":["1.10, meaning the remaining work must be done at 110 percent cost efficiency, which is unlikely given a CPI of 0.90","0.90, meaning the project can finish on budget if performance holds","1.10, meaning the project is 10 percent under budget","0.91, meaning remaining work can be done less efficiently than planned"],"c":[0],"x":["TCPI equals BAC minus EV, divided by BAC minus AC: 660,000 over 600,000, or 1.10. A TCPI well above the current CPI signals the budget is not realistic without change.","0.90 is the CPI. Holding it produces an overrun of about 133,000 dollars.","The value is right but the meaning is wrong. TCPI is the efficiency needed on remaining work, and above 1.0 is harder to achieve.","This inverts the formula. Work remaining goes on top and funds remaining on the bottom."],"case":"b1-C1","q":"The sponsor asks what it would take to finish within the original budget. The project manager calculates the to-complete performance index. What is the result and what does it mean?","rule":"TCPI equals work remaining over funds remaining. Above 1.0 means you must do better than plan on what is left."},{"id":"b1-R6-03","d":"R","t":6,"a":"pr","type":"s","o":["Contingency reserve, which the project manager controls for identified risks","Management reserve, after approval from the sponsor","A change request to increase the project budget","The budget of a later work package"],"c":[0],"x":["Contingency reserve is part of the cost baseline and covers identified risks that occur. The project manager uses it according to the risk response plan.","Management reserve covers unknown unknowns, meaning unforeseen work within scope. This risk was identified.","A budget increase is not needed when reserve was set aside for this risk.","Taking money from other work hides the cost and creates a shortfall later."],"q":"During execution, a known risk occurs: rock is found during excavation, as identified in the risk register. The response will cost 40,000 dollars. Where should the money come from?","rule":"Known risks draw on contingency reserve, which is in the baseline and controlled by the project manager. Unknowns draw on management reserve, which is outside the baseline and needs approval."},{"id":"b1-R6-04","d":"R","t":6,"a":"hy","type":"s","o":["Report the variance to the steering committee with the cause and the recovery plan","Wait one month to see whether the variance recovers","Adjust the earned value figures so the variance falls under 10 percent","Use management reserve to bring the variance under the threshold"],"c":[0],"x":["The threshold is a governance rule. The project manager reports as required and includes the analysis and plan.","Delaying a required report breaks governance and damages trust if the variance grows.","Changing data to avoid reporting is dishonest and a breach of professional ethics.","Management reserve needs approval and is not for hiding variances."],"q":"A project's governance framework states that cost variances above 10 percent must be reported to the steering committee. The monthly report shows a cost variance of 12 percent. The project manager believes it will recover next month. What should the project manager do?","rule":"Follow governance thresholds. Report variances on time, with cause and plan."},{"id":"b1-R6-05","d":"R","t":6,"a":"ag","type":"s","o":["At the current rate the budget will run out before the release backlog is complete, so scope or funding needs a decision","The project is on budget because spending matches the burn rate plan","The team should be enlarged to finish on time","Nothing yet, since agile projects do not forecast cost"],"c":[0],"x":["Six sprints cost 300,000 dollars, half the budget, for 40 percent of the scope. At this rate the full scope needs about 15 sprints, or 750,000 dollars.","Burn rate matching plan only means the team costs what was expected. The scope delivered is behind.","A larger team raises the burn rate and spends the budget faster.","Agile projects forecast using burn rate and velocity."],"q":"An agile project has a fixed team costing 50,000 dollars per sprint and a budget of 600,000 dollars. After 6 sprints the team has delivered 40 percent of the planned release backlog. What should the project manager tell the sponsor?","rule":"Agile cost forecasting: burn rate times sprints remaining, where sprints remaining come from backlog and velocity."},{"id":"b1-R6-06","d":"R","t":6,"a":"pr","type":"s","o":["Reschedule work to fit spending within the funding limit, and assess the schedule impact","Proceed as planned and request the extra funds when they are needed","Reduce the quality requirements to lower cost","Remove the contingency reserve from the baseline"],"c":[0],"x":["Funding limit reconciliation adjusts the timing of work so planned spending does not exceed the funds available in each period.","Committing to work with no funds available risks stopping mid activity.","Quality requirements are part of scope and cannot be cut unilaterally.","Removing reserve does not reduce the cost of planned work and leaves risks unfunded."],"q":"A project's cost baseline requires 400,000 dollars in the second quarter, but the organization's funding limit for the project in that quarter is 300,000 dollars. What should the project manager do?","rule":"Funding limit reconciliation: match the timing of spending to the timing of funds."},{"id":"b1-R7-01","d":"R","t":7,"a":"pr","type":"s","o":["Prevention costs are generally lower than the cost of failures found by customers","More final inspection would be cheaper than training","Quality costs cannot be measured, so the decision is a matter of judgment","Field failures are a cost of doing business and should be accepted"],"c":[0],"x":["Cost of quality shows that money spent on prevention reduces internal and external failure costs, which include warranty, rework, and lost business.","Inspection finds defects after they are made. The cost of making them is still paid.","Cost of quality is a measurable framework: prevention, appraisal, internal failure, and external failure.","An 8 percent field failure rate is a major external failure cost that prevention can reduce."],"q":"A manufacturer finds that 8 percent of delivered units fail in the field. The project manager proposes investing in operator training and process improvements. The finance manager objects to the cost. Which argument is most accurate?","rule":"Prevention over inspection. External failure is the most expensive category of quality cost."},{"id":"b1-R7-02","d":"R","t":7,"a":"pr","type":"s","o":["The process may be out of control and the cause should be investigated","The process is in control because all points are within the limits","The control limits should be widened","The welds should be rejected"],"c":[0],"x":["The rule of seven says seven points in a row on one side of the mean indicate a non-random cause, even inside the limits.","Being inside the limits is not enough. A run of seven is a signal that something has shifted.","Limits are calculated from process data. Changing them to hide a signal defeats the chart.","The points are within limits and likely within specification. The signal is about the process."],"q":"A control chart for weld thickness shows seven consecutive points above the mean, all within the control limits. What should the project manager conclude?","rule":"Out of control means a point outside the limits or seven in a row on one side of the mean."},{"id":"b1-R7-03","d":"R","t":7,"a":"ag","type":"s","o":["Strengthen the definition of done to include testing and documentation, and apply it to every story","Add a hardening sprint before each release to fix defects","Create a separate quality assurance team to check stories after the sprint","Reduce velocity targets so the team has more time"],"c":[0],"x":["The definition of done is the team's shared quality standard. Including the missing items builds quality into each increment.","Hardening sprints push quality work to the end and let defects pile up.","Separating testing from the team delays feedback and removes the team's ownership of quality.","Time may be part of it, but without a clear standard the same gaps will recur."],"q":"An agile team keeps finishing stories that fail in later sprints because of missing tests and documentation. What is the best corrective action?","rule":"In agile, quality is built in through the definition of done. It is not inspected in later."},{"id":"b1-R7-04","d":"R","t":7,"a":"pr","type":"s","o":["Pareto chart","Scatter diagram","Control chart","Ishikawa diagram"],"c":[0],"x":["A Pareto chart ranks causes by frequency and shows the few categories that produce most of the defects.","A scatter diagram shows the relationship between two variables.","A control chart shows process stability over time. It does not rank categories.","An Ishikawa or fishbone diagram explores the causes of one problem. It does not rank categories by count."],"q":"A team has logged 200 defects across twelve categories. The project manager wants to focus effort on the categories causing most of the problems. Which tool is best?","rule":"Pareto ranks (80/20). Fishbone finds causes. Control charts watch stability. Scatter diagrams show correlation."},{"id":"b1-R7-05","d":"R","t":7,"a":"hy","type":"s","o":["A quality audit, which is part of managing quality","Quality control, because a problem was found","Scope validation","A risk review"],"c":[0],"x":["A quality audit is an independent review of whether project activities comply with policies and procedures. It looks at the process.","Quality control measures deliverables against requirements. This review looked at whether the process was followed.","Scope validation is the customer's formal acceptance of deliverables.","A risk review reassesses risks and responses. This review was about process compliance."],"q":"An internal group reviews whether the project team is following the organization's quality procedures and finds that design reviews are being skipped. What is this activity?","rule":"Manage quality, or assurance, looks at the process through audits. Control quality looks at the product through inspection."},{"id":"b1-R7-06","d":"R","t":7,"a":"pr","type":"m","o":["Training the team in the welding procedure","Inspecting and testing finished units","Reworking units that failed inspection","Warranty repairs at the customer site","Scrapping defective material"],"c":[0,1],"x":["Training is a prevention cost, which is a cost of conformance.","Testing and inspection are appraisal costs, which are also costs of conformance.","Rework is an internal failure cost, a cost of nonconformance.","Warranty work is an external failure cost, a cost of nonconformance.","Scrap is an internal failure cost."],"q":"Which two are examples of the cost of conformance? (Choose two)","rule":"Conformance covers prevention and appraisal, money spent to avoid failure. Nonconformance covers internal and external failure, money spent because of it."},{"id":"b1-R8-01","d":"R","t":8,"a":"pr","type":"s","o":["16 days, with 2 days of float on B","14 days, with 0 days of float on B","16 days, with 0 days of float on B","21 days, with 2 days of float on B"],"c":[0],"x":["The paths are A-B-D-E at 14 days and A-C-D-E at 16 days. The longest path is the critical path, 16 days. B is on the shorter path and has 16 minus 14, or 2 days of float.","14 days is the shorter path. The project duration is set by the longest path.","The duration is right, but B is not on the critical path. C is.","21 is the sum of all activities. B and C run in parallel, so they are not added together."],"q":"A schedule has these activities. A takes 3 days and starts the project. B takes 5 days and C takes 7 days, and both follow A. D takes 4 days and follows both B and C. E takes 2 days and follows D. What is the project duration and the total float of activity B?","rule":"The critical path is the longest path and has zero float. Float on another path equals the critical path length minus that path's length."},{"id":"b1-R8-02","d":"R","t":8,"a":"pr","type":"s","o":["Fast track by running critical path activities in parallel, and manage the added risk","Crash the critical path by adding resources","Fast track activities that have the most float","Reduce the testing scope"],"c":[0],"x":["Fast tracking overlaps activities that were planned in sequence. It usually adds risk of rework but not direct cost, which fits the constraint.","Crashing shortens duration by adding cost, and the budget does not allow it.","Shortening non-critical activities does not shorten the project.","Cutting scope or quality is not a schedule compression technique and needs approval."],"q":"A project must finish three weeks sooner than planned. The budget has no room for extra cost, and some critical path activities could overlap. What should the project manager do?","rule":"Crashing costs money. Fast tracking adds risk. Both apply only to the critical path."},{"id":"b1-R8-03","d":"R","t":8,"a":"pr","type":"s","o":["18 days","20 days","16 days","22 days"],"c":[0],"x":["The beta or PERT formula is optimistic plus 4 times most likely plus pessimistic, divided by 6. That is 10 plus 64 plus 34, or 108, divided by 6, which equals 18.","This is the simple average, or triangular distribution: 60 divided by 3. The question asks for beta.","This is the most likely estimate and ignores the wide pessimistic tail.","This is the midpoint of the optimistic and pessimistic estimates. It ignores the most likely value."],"q":"For a design activity, the team gives an optimistic estimate of 10 days, a most likely estimate of 16 days, and a pessimistic estimate of 34 days. Using the beta distribution three point estimate, what is the expected duration?","rule":"Beta or PERT: (O + 4M + P) / 6. Triangular: (O + M + P) / 3. Read which one the question asks for."},{"id":"b1-R8-04","d":"R","t":8,"a":"ag","type":"s","o":["Use relative estimation such as planning poker with story points, comparing stories to each other","Have the most senior developer estimate all the stories","Have the project manager assign the hours based on past projects","Skip estimating and start work"],"c":[0],"x":["Relative sizing is faster and more reliable than hour estimates for uncertain work. Planning poker also brings out different assumptions through discussion.","One person's estimates miss the knowledge of the rest of the team and reduce commitment.","The people doing the work should estimate it.","Without some sizing the team cannot plan a sprint or forecast a release."],"q":"A new agile team is estimating its backlog for the first time. Members argue about how many hours each story will take. What should the project manager suggest?","rule":"Agile teams estimate together and in relative terms. Velocity turns points into forecasts."},{"id":"b1-R8-05","d":"R","t":8,"a":"hy","type":"s","o":["A finish to start relationship with a 7 day lag","A finish to start relationship with a 7 day lead","A start to start relationship with no lag","A separate 7 day activity assigned to the concrete crew"],"c":[0],"x":["The successor starts after the predecessor finishes, plus a waiting period. A lag is a required delay that uses no resources.","A lead speeds up the successor, letting it start before the predecessor finishes. Curing needs a delay.","This would allow steel erection to begin when pouring begins.","Curing takes no labor. A lag models the wait without tying up resources."],"q":"A concrete foundation must cure for 7 days after it is poured before steel erection can start. How should this be shown in the schedule?","rule":"Lag is a delay and lead is an acceleration. Finish to start is the most common dependency."},{"id":"b1-R8-06","d":"R","t":8,"a":"ag","type":"s","o":["Raise it with the team at the daily standup to find what is blocking progress and help remove it","Wait for the sprint review to discuss it","Extend the sprint by three days","Reassign stories among team members to speed things up"],"c":[0],"x":["A flat burndown means work is not completing, often due to an impediment. The team should inspect and adapt, with the project manager's help in removing blockers.","Four days of possible correction would be lost.","Sprints are fixed timeboxes. Unfinished work goes back to the backlog.","The team organizes its own work. The project manager helps find and remove the impediment."],"q":"A sprint burndown chart on day 6 of a 10 day sprint shows remaining work well above the ideal line. It has been flat for three days. What should the project manager do?","rule":"Burndown charts are there so the team can act early. A flat line means a blocker. Find it and remove it."},{"id":"b1-R8-07","d":"R","t":8,"a":"pr","type":"s","o":["Coordinate with operations to agree on the window and record it as a constraint or assumption in the schedule","Schedule the work for the most convenient date for the project team","Leave the shutdown out of the schedule until it is confirmed","Add a large buffer at the end of the schedule to cover any date"],"c":[0],"x":["Schedules must account for operations and other projects. An unconfirmed dependency is resolved by coordination and recorded.","The plant, not the project, controls the shutdown. A schedule built on a guess will fail.","Leaving out a known dependency makes the schedule unrealistic.","A buffer does not settle when the work can happen and may still be wrong."],"q":"A project manager is building a schedule that depends on a shutdown of plant operations. Operations has not confirmed the shutdown window. What should the project manager do?","rule":"Coordinate schedules with operations and other projects. Record unconfirmed items as assumptions and follow up."},{"id":"b1-R9-02","d":"R","t":9,"a":"hy","type":"s","o":["A short dashboard with the measures the committee needs, such as release forecast, budget burn, and top risks, taken from the team's existing data","The team's full task board and burndown charts","A traditional earned value report prepared by the team each week","Nothing, since agile teams demonstrate working product in place of reports"],"c":[0],"x":["Reporting is tailored to the audience. The committee's needs can be met from the team's burnup and burn rate data without adding reporting work for the team.","These serve the team. They hold too much detail for a steering committee.","This imposes heavy reporting on the team and may not fit how the work is managed.","Demonstrations help, but governance bodies still need status, forecast, and risk information."],"q":"A steering committee wants a quick view of whether the project is on track. The team is agile, and the committee is used to predictive reports. What should the project manager provide?","rule":"Tailor artifacts and reports to the audience, and reuse data the team already produces."},{"id":"b1-R9-03","d":"R","t":9,"a":"pr","type":"s","o":["Fixed formula rules such as 0/100 or 50/50 tied to defined completion criteria","Asking team members to be more careful with their percentages","Reporting hours spent against hours planned","Reporting less often so progress looks larger"],"c":[0],"x":["Fixed formula methods credit work only at defined points, which removes subjective percent complete estimates.","The estimates remain subjective. The 90 percent problem is well known.","Hours spent measure effort, not progress.","This hides the problem and delays corrective action."],"q":"A team member reports an activity as 90 percent complete for the third week in a row. The project manager wants progress reporting that is more objective. Which method helps most?","rule":"Measure progress with objective rules such as 0/100, 50/50, or weighted milestones. Effort spent is not progress."},{"id":"b1-R9-04","d":"R","t":9,"a":"ag","type":"s","o":["Work with the team to agree on which artifacts are needed, where they are kept, and who keeps them current","Require the team to produce the full set of predictive project documents","Assign a new team member to tidy the wiki","Accept it, since agile values working software over documentation"],"c":[0],"x":["Artifacts should be tailored to what the team needs, easy to find, and kept up to date. The team decides together so the system gets used.","Heavy documentation that nobody needs is waste. The aim is just enough documentation that is current and findable.","One person tidying once does not create an agreed way of working.","Agile still values documentation that helps the team. Architecture decisions that cannot be found harm it."],"q":"An agile project's artifacts are spread across personal drives, chat threads, and an old wiki. New team members cannot find the current architecture decisions. What should the project manager do?","rule":"Tailor artifacts to need, make them accessible, and keep them current."},{"id":"b1-R10-01","d":"R","t":10,"a":"pr","type":"s","o":["Obtain customer acceptance, hand over the deliverable, complete final lessons learned, archive records, and release the team","Release the team, then obtain acceptance and archive records","Archive records, release the team, then obtain acceptance","Hand over the deliverable, release the team, and skip lessons learned, since they were collected during the project"],"c":[0],"x":["Formal acceptance comes first. Transition, final lessons learned, and archiving follow, and the team is released last so its knowledge is available for them.","If the team is released first, no one is left to fix acceptance issues or contribute lessons learned.","The project cannot be closed administratively before the customer accepts the deliverable.","Lessons are collected throughout, but a final review and update of organizational assets is still part of closure."],"q":"A project's final deliverable has been completed and verified by the team. Which sequence is correct for closing the project?","rule":"Closing order: acceptance, transition, lessons learned and organizational asset updates, archive, release resources."},{"id":"b1-R10-02","d":"R","t":10,"a":"pr","type":"s","o":["Carry out the closing process: document the work completed and the reason for termination, close contracts, capture lessons learned, and release resources","Stop all work and release the team the same day","Continue working until the current deliverable is finished","Ask the team to document only the failures"],"c":[0],"x":["A terminated project still goes through closure. The record of what was done and why is valuable, and contracts and resources must be closed out properly.","Leaving without closure means no record, open contracts, and lost knowledge.","The sponsor has the authority to cancel. Continuing spends money on a cancelled project.","Closure covers all results and lessons, including what worked."],"q":"A sponsor cancels a project at 60 percent complete because of a change in strategy. What should the project manager do?","rule":"Every project is formally closed, including cancelled ones."},{"id":"b1-R10-03","d":"R","t":10,"a":"ag","type":"s","o":["Work with operations to confirm readiness criteria and complete the transition items before release","Release on schedule, since the increment meets the definition of done","Cancel the release and return the stories to the backlog","Ask the development team to run production support permanently"],"c":[0],"x":["Readiness for transition is part of done for a release. Releasing into an unprepared operations group puts the value and the users at risk.","If the definition of done leaves out operational readiness, it is incomplete. The aim is value in use.","The increment is complete. The gap is in the transition, and it can be closed.","This is not a sustainable operating model and pulls the team off product work."],"q":"An agile team is ready to release an increment to production. The operations team says it has not seen the support procedures and has no monitoring set up. What should the project manager do?","rule":"Validate transition readiness with the receiving group before release."},{"id":"b1-R10-04","d":"R","t":10,"a":"hy","type":"m","o":["Confirming that all procurement contracts are closed and final payments are made","Updating organizational process assets with final lessons learned and project records","Baselining the project schedule","Performing qualitative risk analysis","Collecting requirements for the next phase"],"c":[0,1],"x":["Open contracts must be settled and closed as part of closure.","Closure passes knowledge and records to the organization for use by future projects.","Baselining is a planning activity.","Risk analysis is done during planning and throughout the project, not as a closing activity.","That work belongs to the start of the next phase."],"q":"Which two activities are part of closing a project or phase? (Choose two)","rule":"Closure: acceptance, transition, contracts, finances, lessons, archive, release."},{"id":"b1-B1-01","d":"B","t":1,"a":"pr","type":"s","o":["The organization's governance framework and organizational process assets, such as PMO policies and templates","The project schedule from a similar past project","The team's preferences, gathered in a kickoff survey","Industry standards published by professional associations"],"c":[0],"x":["Governance rules, templates, and procedures are organizational process assets. The project's governance is built on them.","A past schedule may help with estimating. It does not define approval or escalation rules.","Team working agreements matter, but organizational governance is set above the project.","External standards inform practice, but the organization's own rules apply first."],"q":"A project manager is assigned to a new project in an organization with a PMO. Before planning starts, she wants to know what approvals, reporting, and escalation rules apply. Where should she look first?","rule":"Governance starts from the organization's process assets. Tailor from there."},{"id":"b1-B1-02","d":"B","t":1,"a":"hy","type":"s","o":["Defining decision authority, thresholds, and escalation paths in the project governance at the start","Holding steering committee meetings more often","Giving the project manager authority over all changes","Avoiding scope additions during execution"],"c":[0],"x":["Clear thresholds, such as the project manager approving up to a set amount, remove doubt about who decides and how fast.","More meetings do not settle who holds the authority.","Unlimited authority removes the oversight that governance exists to provide.","Changes are normal. The need is a clear path for deciding on them."],"q":"A steering committee and a project manager disagree about who may approve a 30,000 dollar scope addition. The issue has delayed a decision for two weeks. What would have prevented this?","rule":"Set governance early: who decides what, up to what limit, and where it escalates."},{"id":"b1-B1-03","d":"B","t":1,"a":"ag","type":"s","o":["Business outcomes and customer value measures, along with delivery measures such as release forecast and quality","Percent of the original requirements document delivered","Hours worked per team member","Number of documents produced"],"c":[0],"x":["Success is defined by value delivered. Agile governance still needs metrics, and they should focus on outcomes and empirical delivery data.","Agile scope is expected to change. Measuring against an initial document rewards building the wrong thing.","Hours measure effort, not value or progress.","Output of documents says nothing about project success."],"q":"An organization is running its first agile project. The PMO asks the project manager to define success metrics. Which set fits best?","rule":"Define success metrics at the start and tie them to value and outcomes."},{"id":"b1-B1-04","d":"B","t":1,"a":"pr","type":"s","o":["Meet with the executive, explain the governance and change process, and invite input through the proper channel","Tell the team to follow the executive's instructions because of seniority","Tell the team to ignore the executive","Report the executive to the ethics hotline"],"c":[0],"x":["The executive's input may be valuable, but it has to come through the agreed governance. A direct, respectful conversation is the first step.","Seniority does not replace governance. Uncontrolled direction causes unapproved changes.","This puts the team in conflict with an executive and ignores input that may be valid.","Nothing here suggests an ethics violation. It is a governance issue to resolve directly."],"q":"A project manager finds that a senior executive, who is not on the steering committee, has been telling team members to change design decisions. What should the project manager do?","rule":"Direct people who bypass governance back to the process, starting with a conversation."},{"id":"b1-B2-01","d":"B","t":2,"a":"pr","type":"s","o":["Assess the regulation's requirements and its impact on the project, then raise the necessary change","Continue work and wait to see whether the regulation is enforced","Stop all site work until monitoring is in place","Ask the sponsor whether compliance is worth the cost"],"c":[0],"x":["Compliance is mandatory. The project manager first needs to know what is required and what it affects, then process the change to scope, cost, and schedule.","Knowingly working out of compliance exposes the organization to fines and stop work orders.","The regulation takes effect next month. Stopping now may be unnecessary and costly.","Legal compliance is not optional. The discussion with the sponsor is about how, not whether."],"q":"During construction, the project manager learns that a new local regulation requires noise monitoring at the site boundary, effective next month. The project has no such monitoring. What should the project manager do first?","rule":"Regulatory compliance is not negotiable. Assess the impact, then handle it through change control."},{"id":"b1-B2-02","d":"B","t":2,"a":"hy","type":"s","o":["Decline the suggestion and work with the team on a compliant option, such as masked or synthetic data","Allow it once, since the deadline is close","Allow it if the developer accepts responsibility in writing","Escalate to the sponsor for a decision"],"c":[0],"x":["The policy is a compliance requirement. The project manager keeps the project within it and helps the team find another route to its goal.","Deadline pressure does not justify a compliance breach. A data incident would cost far more.","Responsibility for compliance cannot be passed to an individual by a note.","The policy is clear. No decision is needed, only a compliant alternative."],"q":"A project handles customer personal data. A developer suggests copying production data into the test environment to speed up testing. The company's privacy policy forbids this without masking. What should the project manager do?","rule":"Never trade compliance for schedule. Find the compliant alternative."},{"id":"b1-B2-03","d":"B","t":2,"a":"pr","type":"s","o":["Record all compliance requirements in a register with category, owner, verification method, and status, and review it regularly","Rely on each discipline lead to remember their own requirements","Address compliance during the final inspection","Ask the client to take responsibility for all compliance"],"c":[0],"x":["Classifying and tracking compliance requirements with owners and verification makes gaps visible before they become violations.","Untracked requirements get missed, especially where disciplines overlap.","Finding a gap at the end is the most expensive time to fix it.","Many of the requirements bind the performing organization by law or contract."],"q":"A project must meet requirements from safety regulators, an environmental permit, corporate security policy, and the client's quality standard. What is the best way to manage them?","rule":"Treat compliance like scope: identify, categorize, assign, verify, and track."},{"id":"b1-B2-04","d":"B","t":2,"a":"ag","type":"s","o":["Include the required compliance evidence in the definition of done so it is produced with each increment","Exempt the team from documentation to keep velocity up","Assign a technical writer to create all the records after development ends","Switch the project to a predictive approach"],"c":[0],"x":["Regulatory documentation is a requirement. Building it into the definition of done keeps it current and avoids a documentation crunch before audit.","The product could not be released legally. Compliance is a constraint on the project.","Records recreated after the fact are often incomplete and may not satisfy auditors.","Agile methods work in regulated settings when compliance is built into the process."],"q":"An agile team building medical device software must produce validation records that auditors will inspect. The team says documentation slows it down and conflicts with agile values. What should the project manager do?","rule":"In regulated agile work, compliance evidence is part of done."},{"id":"b1-B2-05","d":"B","t":2,"a":"pr","type":"m","o":["Make sure the unsafe work stops until proper protection is in place","Review the consequences of the noncompliance and put corrective action in place with the subcontractor","Let the work continue if the subcontractor agrees to fix it by next week","Leave the finding out of the project report to protect the subcontractor relationship","Let the subcontractor handle it, since safety is its responsibility"],"c":[0,1],"x":["Safety risks to people are addressed at once. Work resumes only when it complies.","The project manager has to understand the exposure and prevent it from happening again, under the contract and the safety plan.","A week of known unsafe work is unacceptable under any schedule pressure.","Hiding a safety finding is unethical and may be illegal.","The project shares responsibility for safety at its site and must act."],"q":"A safety audit finds that the project's subcontractor has been working at height without the required fall protection. Which two actions should the project manager take? (Choose two)","rule":"Safety and legal compliance come before schedule and cost. Stop, correct, and prevent recurrence."},{"id":"b1-B3-01","d":"B","t":3,"a":"pr","type":"s","o":["Have the request submitted as a change request so its impact can be assessed before any work is done","Let the work proceed, since the client asked for it","Refuse the change because the design is frozen","Do the work and submit the change request afterward"],"c":[0],"x":["Every change to the baseline goes through change control, whatever its size. Impact on scope, cost, schedule, and risk is assessed before a decision.","A request from the client's engineer is not an approved change. Costs may be unrecoverable.","Changes are not refused outright. They are evaluated, then approved or rejected through the process.","After the fact requests remove the chance to decide and weaken any claim for cost."],"q":"A client's engineer asks a team member to relocate a control panel to a different wall. The team member says it is a small job and starts planning the work. What should the project manager do?","rule":"No work on a change until it is assessed and approved. The size of the change does not matter."},{"id":"b1-B3-02","d":"B","t":3,"a":"pr","type":"s","o":["Update the project management plan and baselines, tell the affected stakeholders, and then implement the change","Implement the change immediately and update documents at project closure","Send the change back to the requester for reconfirmation","Perform a new impact analysis"],"c":[0],"x":["Approved changes are recorded in the plan and documents and communicated so everyone works from the current baseline.","Out of date plans cause errors. Documents are updated when the change is approved.","The board has decided. Reconfirmation adds delay and no value.","Impact analysis was done before the board's decision."],"q":"A change request has been approved by the change control board. What should the project manager do next?","rule":"After approval: update the plan, communicate, implement. Track the change in the change log throughout."},{"id":"b1-B3-03","d":"B","t":3,"a":"pr","type":"s","o":["Present the impact analysis and options to the sponsor, such as added time and budget, or removing other scope","Accept the feature and ask the team to absorb it","Reject the request because it breaks the constraints","Cut testing to make room for the feature"],"c":[0],"x":["The project manager's job is to show the real impact and give options so the decision is informed. The triple constraint cannot be wished away.","This is an impossible commitment that will surface later as delay or defects.","The sponsor is entitled to request changes. The project manager evaluates them and presents them.","Reducing quality to fit scope is not the project manager's call and creates risk."],"q":"A sponsor asks for a major new feature, and says it must not affect the delivery date or the budget. The team's analysis shows it would add six weeks and 80,000 dollars. What should the project manager do?","rule":"Evaluate the impact and present options. Let the decision maker choose with the facts."},{"id":"b1-B3-04","d":"B","t":3,"a":"hy","type":"s","o":["The product owner reprioritizes the backlog, as the agreed approach for the software stream allows","Submit it to the change control board, since all changes on the project need board approval","Reject the swap, because the contract is fixed price","Let the development team decide"],"c":[0],"x":["In the agile stream, equal size swaps in the backlog are the product owner's call. Formal change control covers items that affect the contract baselines.","Putting routine backlog changes through a board removes the benefit of the agile stream. Governance should define which changes need which path.","The fixed price covers the hardware, which is unaffected.","Priority is the product owner's responsibility."],"q":"A hybrid project has a fixed price contract for hardware and an agile software stream. The product owner wants to swap a software feature for another of similar size. The hardware is unaffected. How should this be handled?","rule":"In hybrid projects, define up front which changes go through formal control and which are backlog decisions."},{"id":"b1-B3-05","d":"B","t":3,"a":"pr","type":"s","o":["Tell each requester the status of their request and the expected decision date, and make change status visible from now on","Wait until the board decides, then tell them the outcome","Approve the smaller requests personally to clear the backlog","Ask stakeholders to stop submitting requests until the backlog clears"],"c":[0],"x":["Communicating the status of proposed changes is part of change management. Silence leads to frustration and to people working around the process.","The complaint is about the silence. Requesters need to know where their request stands.","The project manager cannot go beyond the authority defined in the change management plan.","Blocking requests pushes changes outside the process."],"q":"Several stakeholders complain that they submitted change requests weeks ago and have heard nothing. The change log shows the requests are waiting for the next board meeting. What should the project manager do?","rule":"Keep requesters informed. The change log is a communication tool as well as a record."},{"id":"b1-B3-06","d":"B","t":3,"a":"pr","type":"m","o":["Record the decision and the reasons in the change log","Tell the requester the decision and the reasons for it","Implement a smaller version of the change informally","Delete the request from the change log to keep it tidy","Resubmit it at every meeting until it is approved"],"c":[0,1],"x":["All change requests are logged with their disposition, including rejections.","The requester needs to know the outcome and why, to close the loop.","This is an unapproved change and bypasses the board's decision.","Rejected requests stay on record. The history matters for audits and for repeat requests.","Resubmitting without new information wastes the board's time."],"q":"A rejected change request has just come back from the change control board. Which two actions should the project manager take? (Choose two)","rule":"Log every change request whatever the outcome, and communicate the decision."},{"id":"b1-B4-01","d":"B","t":4,"a":"ag","type":"s","o":["Take ownership of the impediment, contact IT security to find the cause of the delay, and escalate if needed","Ask the developers to follow up on their own request","Add the blocker to the impediment log and review it at the retrospective","Reorder the sprint so the developers work on other stories"],"c":[0],"x":["Removing impediments the team cannot remove on its own is a main duty of an agile project leader. A week of three people blocked is costly.","They raised it as a blocker because they have not been able to clear it.","Logging is fine, but waiting for the retrospective leaves three people idle.","This may help for a short time, but the impediment is still there and the sprint goal is at risk."],"q":"At a daily standup, three developers say they are blocked waiting for firewall access from the IT security group. The request was made a week ago. What should the project manager do?","rule":"An agile leader owns impediment removal. Act the same day."},{"id":"b1-B4-02","d":"B","t":4,"a":"pr","type":"s","o":["Carry out the planned risk response and manage the event as an issue in the issue log","Reassess the probability of the risk","Hold a brainstorming session to identify new risks","Wait for the supplier's administrator to make contact"],"c":[0],"x":["When a risk occurs it becomes an issue. The project manager carries out the agreed response and tracks it to resolution.","The event has happened. Probability no longer applies.","New risks should be reviewed, but the first action is to deal with the issue at hand.","Waiting loses time that the response plan was written to save."],"q":"A risk in the register, that a key supplier could go bankrupt, has just happened. The supplier has stopped trading. What should the project manager do first?","rule":"A risk that has occurred is an issue. Carry out the response plan and log the issue."},{"id":"b1-B4-03","d":"B","t":4,"a":"hy","type":"s","o":["Prioritize issues by their impact on project objectives and assign owners and due dates on that basis","Keep first in, first out handling to be fair to everyone who raised an issue","Escalate all twelve issues to the sponsor","Close the minor issues without action to shorten the list"],"c":[0],"x":["Issues are handled by impact and urgency. Blockers on the critical path come first.","Fairness to requesters is not the measure. Impact on the project is.","Most issues are within the project manager's authority. Escalating everything misuses the sponsor's time.","Closing unresolved issues hides them."],"q":"A project manager has twelve open issues. The team is working on them in the order they were raised, and a minor labeling issue is being handled before an issue that blocks system testing. What should the project manager do?","rule":"Evaluate and prioritize impediments by impact. Every issue gets an owner and a due date."},{"id":"b1-B4-04","d":"B","t":4,"a":"ag","type":"s","o":["Measure the interruptions and work with management on a solution, such as a support rotation or reserved capacity","Tell the team to refuse support requests","Lower the sprint goals permanently without telling anyone","Ask the team to do the support work after hours"],"c":[0],"x":["This is a recurring organizational impediment. Data on its impact supports a lasting fix with the people who control the support demand.","Production support may be a real business need. Refusing it does not settle the conflict in priorities.","Hiding the cost keeps the organization from fixing the cause.","This breaks sustainable pace and hides the problem."],"q":"A team keeps missing sprint goals. In the retrospective, members say they are pulled onto production support for another system several times a week. What should the project manager do?","rule":"Recurring impediments need a systemic fix. Bring data to those who own the cause."},{"id":"b1-B4-05","d":"B","t":4,"a":"pr","type":"s","o":["Escalate through the defined escalation path, with the impact and the actions already taken","Keep reminding the procurement lead weekly","Reassign the issue to a team member with no procurement authority","Accept the milestone delay"],"c":[0],"x":["The project manager has tried direct resolution. With a milestone at risk, escalation along the governance path is the right step.","Two reminders have failed and the impact is growing.","Someone without the authority cannot resolve it.","Accepting a delay that can be avoided without using the means available is poor practice."],"q":"An issue was assigned to the procurement lead three weeks ago and has made no progress. It now threatens a milestone. The project manager has raised it with the lead twice. What should the project manager do?","rule":"Try direct resolution first. When it fails and the impact is real, escalate with the facts."},{"id":"b1-B5-01","d":"B","t":5,"a":"pr","type":"s","o":["Develop the risk management plan, which defines how risk activities will be carried out","Identify risks in a team brainstorming session","Perform qualitative risk analysis","Assign risk owners"],"c":[0],"x":["The risk management plan sets the approach, roles, categories, probability and impact definitions, and timing. Identification and analysis follow it.","Identification follows the plan, which defines how it will be done.","Analysis needs identified risks and the definitions from the plan.","Owners are assigned to identified risks, usually during response planning."],"q":"A project manager is starting risk management on a new project. Which should be done first?","rule":"Risk sequence: plan, identify, qualitative analysis, quantitative analysis, plan responses, implement, monitor."},{"id":"b1-B5-02","d":"B","t":5,"a":"ag","type":"s","o":["Risks are identified and reviewed continuously, and high risk items are prioritized early in the backlog to reduce uncertainty sooner","Risk management is unnecessary because short iterations remove risk","A full quantitative risk analysis is done before the first sprint and then frozen","The product owner alone manages risk"],"c":[0],"x":["Agile teams address risk in each iteration, often using spikes and early delivery of risky items so that problems surface while they are cheap to fix.","Iterations reduce exposure, but risks still have to be identified and managed.","Risk management is continuous on any project, and particularly on agile ones.","The whole team identifies risks. The product owner weighs risk when prioritizing."],"q":"How is risk typically handled on an agile project?","rule":"Agile handles risk early and often: spikes, risky items first, review every iteration."},{"id":"b1-B5-03","d":"B","t":5,"a":"pr","type":"s","o":["Transfer","Avoid","Mitigate","Accept"],"c":[0],"x":["The financial effect of the risk is shifted to a third party, the bank, for a fee. Insurance, warranties, and fixed price contracts are other examples.","Avoidance would remove the risk entirely, for example by buying from a domestic supplier.","Mitigation reduces probability or impact but leaves the project carrying the risk.","Acceptance means taking no action beyond perhaps setting aside reserve."],"q":"A project faces a risk of currency fluctuation on a large equipment purchase from abroad. The company buys a forward contract to fix the exchange rate. Which risk response is this?","rule":"Threat responses: avoid, transfer, mitigate, accept, escalate. Transfer shifts the impact to a third party for a price."},{"id":"b1-B5-04","d":"B","t":5,"a":"hy","type":"s","o":["Escalate the risk to the sponsor or the appropriate level, and record that it has been escalated","Accept the risk, since nothing can be done","Mitigate the risk by speeding up project delivery","Remove it from the register, since it is not a project risk"],"c":[0],"x":["Risks outside the project's scope or authority are escalated to the level that can manage them. After escalation, the risk is owned there.","Something can be done by someone with the authority. Acceptance skips that option.","Faster delivery does not address a corporate funding decision.","It should be recorded as escalated so there is a trace."],"q":"During a risk review, a team member identifies a risk that a corporate reorganization could remove the project's funding. This is outside the project manager's authority to address. What should the project manager do?","rule":"Escalate risks that are beyond the project's authority. Record the escalation."},{"id":"b1-B5-05","d":"B","t":5,"a":"pr","type":"s","o":["Perform qualitative risk analysis, rating probability and impact to prioritize the risks","Perform a Monte Carlo simulation on all 60 risks","Plan responses for all 60 risks","Add contingency of 10 percent to the budget"],"c":[0],"x":["Qualitative analysis quickly ranks risks so that effort goes to the ones that matter. It comes before quantitative analysis and response planning.","Quantitative analysis is costly and is applied to the top risks where it is warranted.","Planning responses before prioritizing wastes effort on minor risks.","A flat percentage is not tied to the project's actual risk exposure."],"q":"A team has identified 60 risks. The project manager wants to decide which deserve detailed attention. What should be done next?","rule":"Qualitative analysis prioritizes. Quantitative analysis puts numbers on the top risks. Then plan responses."},{"id":"b1-B5-06","d":"B","t":5,"a":"ag","type":"s","o":["Schedule a spike early to test the API's performance and reduce the uncertainty","Wait until the feature's sprint to find out","Assume the vendor's documentation is accurate","Remove the feature from the backlog"],"c":[0],"x":["A spike is a timeboxed investigation. Doing it early lets the team change direction while options are open.","Finding a blocker six sprints in leaves little time and few options.","An untested assumption on a critical dependency is an unmanaged risk.","The feature has value. The uncertainty should be investigated before it is dropped."],"q":"An agile team is unsure whether a third party payment API can handle the required transaction volume. The feature that depends on it is planned for six sprints from now. What should the team do?","rule":"Use spikes to buy information early on risky unknowns."},{"id":"b1-B5-07","d":"B","t":5,"a":"pr","type":"s","o":["50,000 dollars","90,000 dollars","350,000 dollars","130,000 dollars"],"c":[0],"x":["EMV is probability times impact. Risk A is minus 60,000, Risk B is minus 30,000, and Risk C is plus 40,000. The net is minus 50,000, so 50,000 dollars of reserve.","This covers the two threats only. Opportunities offset threats in the EMV total.","This is the sum of the full threat impacts, ignoring probability.","This adds all three EMVs as if the opportunity were a cost."],"case":"b1-C2","q":"Using expected monetary value, what contingency reserve do these three risks justify?","rule":"EMV equals probability times impact. Threats are negative and opportunities positive. Add them for the net exposure."},{"id":"b1-B5-08","d":"B","t":5,"a":"pr","type":"s","o":["Yes, because the cost is less than Risk A's expected monetary value of 60,000 dollars","No, because there is a 70 percent chance the delivery will be on time anyway","Yes, because any risk with an impact of 200,000 dollars must be removed","No, because the payment would use most of the contingency reserve"],"c":[0],"x":["Paying 45,000 to remove an exposure with an EMV of 60,000 is a net expected gain of 15,000. The response is cost effective.","The decision compares the response cost with the EMV, not with the probability alone.","Impact alone does not justify a response. A response has to be cost effective against the expected value.","If Risk A is removed, the reserve needed falls as well. The comparison is cost against EMV."],"case":"b1-C2","q":"Should the project manager recommend paying 45,000 dollars for the guaranteed production slot?","rule":"A risk response is worth it when it costs less than the expected value it removes."},{"id":"b1-B5-09","d":"B","t":5,"a":"pr","type":"s","o":["Enhance","Exploit","Share","Accept"],"c":[0],"x":["Enhancing raises the probability or the benefit of an opportunity without guaranteeing it.","Exploiting makes sure the opportunity happens. An early application raises the odds but does not guarantee the rebate.","Sharing gives some ownership of the opportunity to a third party better placed to capture it.","Accepting means taking the benefit if it occurs, with no active steps."],"case":"b1-C2","q":"To improve the chance of winning the rebate, the project manager assigns an engineer to prepare the application early and meet the utility's program staff. Which opportunity response is this?","rule":"Opportunity responses: exploit makes it certain, enhance makes it more likely, share brings in a partner, accept takes no action, and escalate passes it up."},{"id":"b1-B5-10","d":"B","t":5,"a":"hy","type":"m","o":["A risk owner responsible for monitoring the risk and carrying out the response","The agreed response strategy and the trigger that signals the risk is about to occur","The names of the team members who might cause the risk","The project's earned value data","The full text of the contract"],"c":[0,1],"x":["Each risk needs a named owner. A risk with no owner is not managed.","Knowing the response and its trigger in advance lets the team act quickly.","Risk registers record uncertain events. They do not assign blame.","Earned value belongs in performance reports.","Contracts are separate documents. The register refers to them where relevant."],"q":"Which two items should a risk register entry include after risk responses have been planned? (Choose two)","rule":"Every risk has an owner, a response, and a trigger. Review the register regularly."},{"id":"b1-B6-01","d":"B","t":6,"a":"ag","type":"s","o":["Agree on an experiment, such as a work in progress limit, try it in the next sprint, and review the result","Note the finding and move on, since the release is done","Ask management to set a new policy for all teams","Blame the developers who started stories late"],"c":[0],"x":["Continuous improvement works through small, measurable experiments that are reviewed and either kept or dropped.","A finding with no action changes nothing.","The team owns its process and should test the change locally before anyone scales it.","Blame discourages openness. The matter is a process problem."],"q":"After a release, an agile team reviews its process and sees that defects rose whenever stories were started late in the sprint. What should the team do?","rule":"Improve in small experiments: inspect, adapt, measure, repeat."},{"id":"b1-B6-02","d":"B","t":6,"a":"pr","type":"s","o":["Submit it to the PMO or process owner so it becomes part of the organization's process assets","Archive it with the project files","Keep it within the team as a competitive advantage","Discard it, since each project is unique"],"c":[0],"x":["Improvements that work should be passed to the organization so other projects benefit. Updating organizational process assets is part of continuous improvement.","Archived files are rarely found. The checklist should go into the templates others actually use.","Withholding improvements from one's own organization helps no one.","Projects are unique, but many processes repeat across them."],"q":"A project team developed a new checklist for factory acceptance tests that cut test failures by half. The project is closing. What should the project manager do with the checklist?","rule":"Feed proven improvements back into organizational process assets."},{"id":"b1-B6-03","d":"B","t":6,"a":"hy","type":"s","o":["Review the earlier project's lessons learned and talk to its team during planning","Copy the earlier project's plan without changes","Wait until problems arise, then check whether the earlier project had them","Rely on her own experience"],"c":[0],"x":["Lessons learned are an input to planning. Talking with the people involved adds context that the written record lacks.","Conditions differ between projects. Lessons inform the plan, but they do not replace planning.","This loses the chance to prevent the problems.","Organizational knowledge is wider than one person's memory."],"q":"A project manager starts a project similar to one completed last year.

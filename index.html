<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMP Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#ECEFF5;--surface:#FFFFFF;--sunk:#E2E7F0;--ink:#13213A;--muted:#56647F;--line:#D3DAE6;
  --primary:#2447C9;--primary-ink:#FFFFFF;--primary-soft:#E4EAFB;
  --amber:#B87503;--amber-soft:#FBF0D9;
  --ok:#17744E;--ok-soft:#E1F3EA;--bad:#B93434;--bad-soft:#FBE8E8;
  --people:#0B7F84;--process:#2447C9;--biz:#87399C;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --r-lg:18px;--r-md:12px;--r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1422;--surface:#152035;--sunk:#0F192B;--ink:#E8EDF6;--muted:#93A2BE;--line:#27354E;
  --primary:#86A1FF;--primary-ink:#0C1422;--primary-soft:#1C2B52;
  --amber:#F0B445;--amber-soft:#33290F;
  --ok:#55C994;--ok-soft:#11322A;--bad:#F28585;--bad-soft:#3A1B22;
  --people:#45C4C9;--process:#86A1FF;--biz:#CD92E0;
}}
:root[data-theme="dark"]{
  --bg:#0C1422;--surface:#152035;--sunk:#0F192B;--ink:#E8EDF6;--muted:#93A2BE;--line:#27354E;
  --primary:#86A1FF;--primary-ink:#0C1422;--primary-soft:#1C2B52;
  --amber:#F0B445;--amber-soft:#33290F;
  --ok:#55C994;--ok-soft:#11322A;--bad:#F28585;--bad-soft:#3A1B22;
  --people:#45C4C9;--process:#86A1FF;--biz:#CD92E0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* header and navigation */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand svg{display:block}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.nav button svg{display:none}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--bg);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
@media (max-width:719px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .nav button{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:6px 2px;border-radius:12px;position:relative}
  .nav button svg{display:block}
  .nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .nav .dot{position:absolute;top:2px;left:54%}
  main{padding-bottom:96px}
}
body.focus .nav,body.focus .top{display:none}
main{padding-top:22px;padding-bottom:60px}

/* type */
.h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack>*+*{margin-top:16px}
.stack-lg>*+*{margin-top:28px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:12px 18px;border-radius:var(--r-md);font-weight:600;min-height:48px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.big{width:100%;font-size:17px;min-height:56px}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);padding:10px 12px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* the day plan: a schedule bar for the 60 minute session */
.plan{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:24px 22px}
.plan .h1{font-size:34px}
.plan .sub{color:inherit;opacity:.72}
.bar{display:grid;gap:4px;margin-top:20px}
.seg{height:16px;border-radius:5px;background:var(--sunk);overflow:hidden}
.plan .seg{background:rgba(127,135,150,.38)}
.bar.compact{margin-top:0}
.bar.compact .seg{height:8px}
.seg i{display:block;height:100%;background:var(--amber);border-radius:5px;transition:width .4s}
.seglabels{display:grid;gap:4px;margin-top:8px;font-size:12.5px;line-height:1.25}
.seglabels b{display:block;font-weight:600}
.seglabels span{opacity:.7}
.plan .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg);margin-top:22px}
@media (prefers-reduced-motion:reduce){.seg i{transition:none}}

/* streak strip */
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1/1.5;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.day i{position:absolute;left:0;right:0;bottom:0;background:var(--amber);opacity:.55}
.day.full i{opacity:1}
.day.today{outline:2px solid var(--ink);outline-offset:1px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.tile .n{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted);margin-top:3px}
button.tile{text-align:left;width:100%}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14.5px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:block}
.field>span{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
select,input[type=date]{width:100%;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);min-height:48px}

/* domain marks */
.dm{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline}
.dm.P{background:var(--people)}.dm.R{background:var(--process)}.dm.B{background:var(--biz)}

/* quiz */
.qtop{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.qtop .wrap{display:flex;align-items:center;gap:10px;height:56px}
.qtop .where{flex:1;min-width:0;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .clock{font-weight:700;font-size:15px}
.qprog{height:4px;background:var(--sunk)}
.qprog i{display:block;height:100%;background:var(--primary)}
.tags{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.tags .ai{color:var(--amber);font-weight:600}
.stem{font-family:var(--read);font-size:20.5px;line-height:1.5;max-width:66ch}
@media (max-width:520px){.stem{font-size:19px}}
.case{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--r-md);padding:4px 16px}
.case summary{font-weight:700;padding:10px 0;cursor:pointer}
.case .body{font-family:var(--read);font-size:17.5px;line-height:1.5;white-space:pre-line;padding-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;font-size:16.5px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .k{background:var(--primary);color:var(--primary-ink)}
.optwrap.done .opt{cursor:default}
.optwrap.right .opt{border-color:var(--ok);background:var(--ok-soft)}
.optwrap.right .k{background:var(--ok);color:var(--surface)}
.optwrap.wrong .opt{border-color:var(--bad);background:var(--bad-soft)}
.optwrap.wrong .k{background:var(--bad);color:var(--surface)}
.why{font-size:15px;line-height:1.45;padding:8px 6px 4px 54px;color:var(--ink)}
.why b{font-weight:700}
.optwrap.right .why b{color:var(--ok)}
.optwrap.wrong .why b,.optwrap.plain .why b{color:var(--bad)}
.optwrap.plain .why{color:var(--muted)}
.verdict{border-radius:var(--r-md);padding:14px 16px;font-weight:700;font-size:17px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.rule{background:var(--amber-soft);border-radius:var(--r-md);padding:14px 16px;font-size:15.5px}
.rule b{display:block;color:var(--amber);font-size:13.5px;margin-bottom:3px}
.matchrow{display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px}
.matchrow.right{border-color:var(--ok);background:var(--ok-soft)}
.matchrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.matchrow .l{font-weight:600}
.qactions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:14px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap}
.qactions .btn.primary{flex:1 1 200px}
.gridnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.gridnav button{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.gridnav button.ans{background:var(--primary-soft);border-color:var(--primary)}
.gridnav button.flag{box-shadow:inset 0 -4px 0 var(--amber)}
.gridnav button.cur{outline:2px solid var(--ink)}

/* progress */
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:5px}
.meter .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:75%}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.drow .meter{grid-column:1/-1}
.tasks{display:grid;gap:6px}
.task{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;font-size:14.5px}
.task .pct{text-align:right;font-weight:700}
.task .cnt{display:block;font-size:12px;color:var(--muted);font-weight:400}
.task.low .pct{color:var(--bad)}.task.mid .pct{color:var(--amber)}.task.high .pct{color:var(--ok)}
.notice{border-radius:var(--r-md);padding:14px 16px;background:var(--primary-soft);font-size:15px}
.notice.warn{background:var(--amber-soft)}
.lock{opacity:.7}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.item summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start;list-style:none}
.item summary::-webkit-details-marker{display:none}
.mark{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--surface)}
.mark.ok{background:var(--ok)}.mark.no{background:var(--bad)}.mark.na{background:var(--muted)}
.item .stem{font-size:17px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
svg text{font-family:var(--ui)}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="4" width="14" height="5" rx="2" fill="var(--amber)"/><rect x="6" y="11" width="19" height="5" rx="2" fill="var(--primary)"/><rect x="12" y="18" width="9" height="5" rx="2" fill="var(--biz)"/></svg>PMP Daily</div>

<script type="application/json" id="bank">{"questions":[{"id":"b1-P1-01","d":"P","t":1,"a":"ag","type":"s","o":["Set up a working session where the product owner walks the team through the vision and links it to the current backlog","Email the vision statement to the new developers and ask them to confirm they read it","Ask the functional manager to brief the new developers on the business case","Add a story to the next sprint for the team to rewrite the vision statement"],"c":[0],"x":["The team needs the vision explained by its owner and tied to the work in front of them. A working session gives both and lets new members ask questions.","Sending a document is one-way. It does not check understanding or connect the vision to the stories the team is building.","The functional manager does not own the product vision. The product owner does, and the whole team should hear it together.","The problem is awareness, and the vision may be fine as written. Rewriting it skips the step of finding out."],"q":"Three developers joined an agile team last sprint. In the retrospective they say they finish stories without knowing why the product matters. The product owner wrote a vision statement months ago, but it sits in a folder nobody opens. What should the project manager do?","rule":"A vision only works when the people doing the work can repeat it. Share it face to face and connect it to the backlog."},{"id":"b1-P1-02","d":"P","t":1,"a":"pr","type":"s","o":["Meet with both directors and the sponsor to agree on the objectives and revise the charter wording","Proceed with planning based on the charter, since it is already signed","Plan for both capacity increase and cost reduction to satisfy both directors","Ask the team to vote on which objective makes more technical sense"],"c":[0],"x":["The two directors hold different pictures of success. Getting them and the sponsor to agree, and recording it in the charter, removes the conflict before planning builds on it.","A signed charter with vague objectives does not settle the disagreement. Planning on top of it produces rework later.","This adds scope no one has approved and hides the disagreement instead of resolving it.","The team does not decide business objectives. That belongs to the sponsor and the affected stakeholders."],"q":"During the kickoff meeting for a plant upgrade, the operations director describes the project as a capacity increase. The finance director describes it as a cost reduction effort with no added capacity. The charter is signed but states the objective in general terms. What should the project manager do first?","rule":"When stakeholders describe different end results, stop and get agreement before planning. The sponsor owns the final call on objectives."},{"id":"b1-P1-03","d":"P","t":1,"a":"hy","type":"s","o":["Work with the sponsor to confirm how the strategy change affects the project vision, then share the updated vision with the team and stakeholders","Tell the team to stop all work on features for the dropped market right away","Continue the current plan until a formal change request arrives from the sponsor","Record the strategy announcement in the lessons learned register"],"c":[0],"x":["The vision has to stay current with strategy. The sponsor confirms the direction, and the team needs to hear it so the work follows.","The project manager has not confirmed the impact with the sponsor. Stopping work on an assumption could cut something still needed.","Waiting means the team spends money on work that may have no value. The project manager should act on known changes.","This is an active change to the project's direction. Logging it as a lesson does nothing to correct the work."],"q":"A hybrid project is six months in when the company announces a new strategy that drops one of the two markets the product was aimed at. The team keeps building features for both markets. What should the project manager do?","rule":"Keep the vision current. When strategy moves, confirm the impact with the sponsor and tell the team quickly."},{"id":"b1-P1-04","d":"P","t":1,"a":"ag","type":"s","o":["Bring the product owner, team, and stakeholders together to review the product roadmap and find where their understanding of the goal differs","Ask the product owner to write more detailed acceptance criteria","Extend the sprint review so the team can demo more features","Replace the sprint review with a written status report to stakeholders"],"c":[0],"x":["Each group believes it is right, so the gap is in shared understanding. Reviewing the roadmap together exposes where the pictures differ.","Acceptance criteria describe individual stories. The complaint is about how the stories connect to a goal.","More demo time shows more features but does not explain how they connect.","This removes the main feedback loop and makes the misunderstanding harder to find."],"q":"Stakeholders attend every sprint review but complain that the features shown do not seem to add up to anything. The product owner says the backlog is ordered correctly. The team says it is building exactly what the stories ask for. What is the best action for the project manager?","rule":"When everyone is doing their part and the result still confuses people, look for the root cause in the shared vision."},{"id":"b1-P1-05","d":"P","t":1,"a":"hy","type":"m","o":["Revisit the vision with the sponsor and key stakeholders at each phase gate or release","Display the vision where the team works and refer to it when prioritizing","Lock the vision statement under change control so it cannot be edited","Limit vision discussions to the kickoff to avoid confusing the team","Delegate ownership of the vision to the most senior developer"],"c":[0,1],"x":["Scheduled checkpoints give a natural point to confirm the vision still matches the business need.","Using the vision in daily decisions keeps it in front of the team and exposes drift early.","A vision should change when the business need changes. Locking it guarantees it goes stale.","One exposure at kickoff does not survive 18 months, new joiners, and changing conditions.","The vision is owned by the sponsor or product owner, who are accountable for business value."],"q":"A project manager wants to keep the project vision current over an 18 month hybrid project. Which two actions support that? (Choose two)","rule":"A vision is maintained, the same way a plan is. Review it at set points and use it when making decisions."},{"id":"b1-P2-01","d":"P","t":2,"a":"ag","type":"s","o":["Meet with the two engineers to understand each position and help them work out a solution together","Choose the framework so the team can move on","Escalate the disagreement to the engineering director","Ask the engineers to keep technical debates out of the standup"],"c":[0],"x":["The conflict is between two people and is now affecting the team. The first step is to understand the source and let those involved solve it with help.","Forcing a decision ends the argument but leaves the conflict unresolved, and the team loses ownership of a technical choice.","Escalation comes after the project manager and the parties have tried to resolve it. It is too early.","This hides the conflict. It will continue elsewhere and the team will still be affected."],"q":"Two senior engineers on a Scrum team disagree about which framework to use for a new service. The argument has come up in three daily standups, and other team members have stopped offering opinions. What should the project manager do first?","rule":"Deal with conflict early, directly, and with the people involved. Collaborate first. Escalate last."},{"id":"b1-P2-02","d":"P","t":2,"a":"pr","type":"s","o":["Review the facts with both leads, identify the cause of the delay, and agree on how handoffs will work going forward","Record the mechanical lead as responsible since the drawings were late","Tell both leads to resolve it between themselves and report back","Add ten days of buffer to every future handoff"],"c":[0],"x":["Looking at the facts moves the discussion from blame to cause. Agreeing on the handoff process fixes the problem for the next package.","Assigning blame ignores the requirement changes and damages the working relationship without fixing the process.","They have already shown they cannot do this alone. The project manager should facilitate.","Padding the schedule treats the symptom and costs time on every package without removing the cause."],"q":"A project's mechanical lead and electrical lead each blame the other for a late design package. The schedule shows the electrical work depended on mechanical drawings that arrived ten days late, and the mechanical lead says requirements changed twice. What should the project manager do?","rule":"Focus conflict on the problem and the facts, and leave the meeting with an agreed way of working."},{"id":"b1-P2-03","d":"P","t":2,"a":"ag","type":"s","o":["Speak with the team member privately, refer to the team's ground rules, and ask what is behind the behavior","Raise the issue in front of the team at the next standup","Report the behavior to the team member's functional manager","Move the standup to a later time to suit the team member"],"c":[0],"x":["The ground rules were set by the team, so the first step is a private conversation that points to them and looks for a cause.","Public correction embarrasses the person and turns a simple issue into a conflict.","Going to the manager first skips the direct conversation the project manager owes the team member.","Changing the team's agreement for one person without the team's input rewards the violation."],"q":"A team member repeatedly joins the daily standup late and takes calls during it. The team agreed at the start of the project that standups begin on time with phones away. Others are visibly annoyed. What should the project manager do?","rule":"Ground rule violations are handled privately first, using the rules the team itself wrote."},{"id":"b1-P2-04","d":"P","t":2,"a":"pr","type":"s","o":["Bring both parties together with the specification, agree on the interpretation in writing, and define how future disagreements will be raised","Ask the owner to replace the inspector","Instruct the supervisor to follow whatever the inspector says","Let the two continue since disagreement is normal on site"],"c":[0],"x":["The source is a differing reading of a document. Settling the reading in writing and agreeing on a process prevents repeat stoppages.","This removes a person without settling what the specification requires. The next inspector may read it the same way.","This is forcing. It may create cost the contractor is not obligated to carry and leaves the interpretation unsettled.","Work has stopped twice. The conflict is now harming the project and needs action."],"q":"A contractor's site supervisor and the owner's inspector argue at every inspection, and work has stopped twice this month while they argued. Both claim the specification supports their reading. What is the best approach for the project manager?","rule":"Find the source of a conflict. When the source is a document, resolve the document."},{"id":"b1-P2-05","d":"P","t":2,"a":"hy","type":"s","o":["Acknowledge the analyst's idea in the session, ask for it to be discussed on its merits, and speak privately with the architect afterward","Ignore it to avoid embarrassing the architect","Stop the workshop and reprimand the architect","Ask the analyst to send the idea by email after the meeting"],"c":[0],"x":["This restores the analyst's standing in the moment and deals with the architect's behavior in private, where it belongs.","Letting it pass signals that the behavior is acceptable and the team loses the analyst's input.","A public reprimand escalates the situation and makes the rest of the group less willing to speak.","This moves the idea out of the group discussion and confirms that speaking up in the room is unsafe."],"q":"During a planning workshop, a quiet analyst proposes an approach and a senior architect dismisses it with a sarcastic remark. The analyst stops contributing. What should the project manager do?","rule":"Protect psychological safety in the moment. Correct behavior in private."},{"id":"b1-P2-06","d":"P","t":2,"a":"ag","type":"s","o":["Meet with both leads to separate the personal issue from the technical one and agree on rules for using the shared environment","Request a second test environment so the teams no longer interact","Ask the program manager to decide which team owns the environment","Wait until the next retrospective for the teams to raise it"],"c":[0],"x":["The technical problem has a technical fix, such as a booking or ownership rule. Separating it from the personal friction lets the leads work on what can be solved.","Buying infrastructure to avoid a conversation is costly and leaves the relationship damaged.","The leads have not yet been helped to solve it themselves. Escalation is premature.","The conflict is already personal. Waiting lets it get worse."],"q":"Two agile teams share a test environment. Each accuses the other of breaking it, and the argument between the two team leads has become personal. Both teams report to the same program. What should the project manager do first?","rule":"Separate people from the problem. Solve the shared problem with agreed rules."},{"id":"b1-P2-07","d":"P","t":2,"a":"pr","type":"m","o":["Identify what each department needs from the resources and by when","Determine how far the conflict has escalated and who is affected","Announce which department will get priority","Remove one department's representative from the project","Update the resource calendar to split the hours evenly"],"c":[0,1],"x":["Understanding the underlying needs shows where the positions can both be met and where they truly collide.","The stage and reach of a conflict decide which resolution approach fits.","This is a resolution, and a forced one. Analysis comes before choosing a strategy.","This is an action against a person and does not explain or resolve the conflict.","This is a compromise imposed before the needs are understood. It may satisfy neither party."],"q":"A project manager is analyzing a conflict between two departments over resource priority. Which two actions belong to analyzing the context of the conflict? (Choose two)","rule":"Analyze before acting: who, what they need, how far it has gone. Then pick the strategy."},{"id":"b1-P2-08","d":"P","t":2,"a":"pr","type":"match","left":["Collaborate or problem solve","Compromise or reconcile","Smooth or accommodate","Force or direct","Withdraw or avoid"],"right":["Both parties work through the issue openly until they reach a solution they both commit to","Each party gives up something to reach a partial agreement","Areas of agreement are emphasized and one side concedes to keep harmony","One party uses authority to impose a decision","The issue is postponed or left for others to resolve"],"q":"Match each conflict resolution approach to the situation that describes it.","why":"Collaboration gives the most durable result and is the default on the exam. Compromise leaves both sides partly dissatisfied. Smoothing and withdrawing delay the issue. Forcing is for emergencies, safety, or when time has run out.","rule":"Default to collaborate. Know the other four so you can recognize them in the wrong options."},{"id":"b1-P3-01","d":"P","t":3,"a":"ag","type":"s","o":["Let the team pull work and decide how to do it, and focus on removing what blocks them","Assign stories more carefully, matching each to the developer's strengths","Add a second daily meeting to catch problems sooner","Ask the product owner to reduce the sprint scope"],"c":[0],"x":["Agile teams are self-organizing. Assigning tasks and demanding reports takes away the ownership that drives their performance.","This is still command and control. The problem is who decides, and better assignments do not change that.","More reporting adds overhead and signals less trust.","Scope may need adjusting later, but the cause here is the leadership style."],"q":"A project manager moves from a predictive environment to lead an agile team. In the first sprint she assigns each story to a named developer and asks for daily progress reports. Velocity is low and the team seems disengaged. What should she change?","rule":"On an agile team the leader serves. The team decides how. The leader clears the path."},{"id":"b1-P3-02","d":"P","t":3,"a":"pr","type":"s","o":["Hold a session to define roles, responsibilities, and decision authority, and record them in a responsibility assignment matrix","Wait for the team to move through the storming stage on its own","Assign all approvals to the project manager to avoid confusion","Send the team to a team building event"],"c":[0],"x":["The symptoms point to unclear roles. Defining them with the team and recording them removes the duplication and the gaps.","Team development benefits from the project manager's help. Waiting costs rework.","This creates a bottleneck and ignores who in the team has the expertise to approve.","Relationships are not the problem. Unclear responsibilities are."],"q":"A newly formed team of specialists from four departments has started work. Members are polite, but they duplicate tasks and leave others undone, and nobody is sure who approves design changes. What should the project manager do?","rule":"Duplicated or dropped work means unclear roles. Fix it with the team and write it down."},{"id":"b1-P3-03","d":"P","t":3,"a":"ag","type":"s","o":["Thank her for raising it, help get the blocker resolved, and reinforce with the team that raising impediments early is expected","Reassign the task to a more experienced developer","Tell her to raise issues at standup in future","Log the delay as a risk in the risk register"],"c":[0],"x":["The blocker needs removing, and the reason she hid it needs addressing so the next impediment surfaces on day one.","This confirms her fear of looking incompetent and teaches the team to hide problems.","The instruction ignores why she stayed quiet, and the current blocker is still not handled.","It has already happened, so it is an issue. Logging alone does not remove it."],"q":"A developer on an agile team tells the project manager that a vendor library keeps failing and she has spent three days trying workarounds. She did not mention it at standup because she did not want to look incompetent. What should the project manager do?","rule":"A servant leader removes impediments and makes it safe to report them."},{"id":"b1-P3-04","d":"P","t":3,"a":"hy","type":"s","o":["Rotate meeting times and add ways to contribute outside the live call so all locations have a fair chance to take part","Ask the Sharjah and Manila members to speak up more","Record the calls so the other locations can watch later","Make decisions with the New Jersey group and send a summary"],"c":[0],"x":["The schedule puts two locations at a disadvantage. Rotating times and adding asynchronous input gives every member a real voice.","This puts the burden on the people being disadvantaged and ignores the structural cause.","Recordings let them see decisions after the fact. They still have no input.","This formalizes the exclusion and wastes the knowledge in the other offices."],"q":"A project team includes members in New Jersey, Sharjah, and Manila. The Sharjah and Manila members rarely speak in team calls, which are held at 9 a.m. New Jersey time, and decisions are often made without their input. What should the project manager do?","rule":"Include every location in decisions. Fix the structure before asking people to change."},{"id":"b1-P3-05","d":"P","t":3,"a":"pr","type":"s","o":["Discuss his goals with him and look for assignments that give him more responsibility or a new challenge","Offer a one time bonus for completing the current phase","Remind him of the performance standards in his role description","Reduce his workload so he can recover"],"c":[0],"x":["His signal is about growth and recognition. Matching work to his goals addresses the actual motivator.","Pay can remove dissatisfaction but seldom restores interest in routine work.","This treats a motivation problem as a discipline problem.","He is bored, not overloaded. Less work makes it worse."],"q":"A highly skilled engineer has delivered excellent work for a year and now says the work feels routine. His performance is starting to slip. Which action best addresses this?","rule":"Motivation comes from growth, responsibility, and recognition. Ask the person what matters to them."},{"id":"b1-P3-06","d":"P","t":3,"a":"ag","type":"s","o":["Speak with the sponsor, explain the effect on the sprint goal, and route the request through the product owner for prioritization","Tell the developers to do what the sponsor asks","Tell the sponsor that no changes are allowed during a sprint","Have the developers work overtime to do both"],"c":[0],"x":["The project manager shields the team from interruption and directs the request to the person who owns priority. The sponsor's need is still handled.","This breaks the sprint commitment and bypasses the product owner. It also sets a precedent for future interruptions.","A flat refusal ignores a real business need. The product owner can decide whether the sprint should change.","Overtime hides the cost of the interruption and is not sustainable."],"q":"A sponsor walks into the team room mid sprint and tells two developers to drop their stories and build a report he needs for a board meeting. The developers look to the project manager. What should the project manager do?","rule":"Protect the team from direct interruptions. New work goes through the product owner."},{"id":"b1-P3-07","d":"P","t":3,"a":"hy","type":"s","o":["Adjust her style for each person, giving more direction to the graduates and delegating more to the experienced members","Keep the same approach to be fair to everyone","Stop giving instructions altogether","Ask the experienced members to be patient"],"c":[0],"x":["Leadership style should fit the person's competence and commitment. One style for all under-serves someone.","Treating everyone identically is not the same as treating them fairly. The experienced members need autonomy.","The graduates still need direction and would struggle without it.","This asks them to accept the problem and does nothing to fix it."],"q":"A project manager leads a team with two very experienced members and three recent graduates. She has been giving everyone the same detailed daily instructions. The experienced members are frustrated and the graduates are doing well. What should she do?","rule":"Match leadership style to the individual and the situation. Direct novices, delegate to experts."},{"id":"b1-P3-08","d":"P","t":3,"a":"ag","type":"s","o":["Explain that velocity is a team planning measure and offer team level outcomes such as delivered value and sprint goal achievement","Provide the individual totals as requested","Refuse and tell management that agile teams do not report metrics","Ask the developers to track their own hours so a fair ranking can be made"],"c":[0],"x":["Story points are a relative team estimate. Using them to rank individuals distorts estimates and harms collaboration. The project manager represents the team and educates management.","This misuses the metric and gives developers a reason to inflate estimates and avoid helping each other.","Agile teams do report. The right response offers useful measures in place of the harmful one.","This adds tracking overhead and still pushes individual ranking on a team that works collectively."],"q":"A team completes its first three sprints. Management asks the project manager to present each developer's individual story point totals so they can rank performance. What should the project manager do?","rule":"Speak for the team with management. Velocity belongs to the team and is for planning only."},{"id":"b1-P3-09","d":"P","t":3,"a":"pr","type":"m","o":["Involve team members in estimating and planning their own work packages","Give team members authority to make decisions within defined limits","Approve every task before work starts to ensure quality","Keep the schedule confidential so the team is not distracted","Rotate team members weekly so no one owns a deliverable"],"c":[0,1],"x":["People who plan their own work commit to it and produce better estimates.","Clear decision limits let the team act without waiting while the project manager stays accountable.","This centralizes control and slows the team, which is the opposite of empowerment.","Withholding information prevents people from making good decisions.","Constant rotation removes ownership and continuity."],"q":"A project manager wants to empower a capable team on a predictive project. Which two actions do that? (Choose two)","rule":"Empowerment means a say in the plan and authority to decide within limits."},{"id":"b1-P4-01","d":"P","t":4,"a":"pr","type":"s","o":["Work with the sponsor and early team members to identify further stakeholders, then analyze their interest and influence","Begin planning communications for the eight people on the list","Send the eight stakeholders the project charter for approval","Wait until requirements gathering to find other stakeholders"],"c":[0],"x":["An initial list is seldom complete. Identification is done widely and early, and analysis follows so engagement can be planned.","Planning on an incomplete list misses people who can stop or shape the project, such as customer service staff or regulators.","The charter is already approved. This does not advance stakeholder identification.","Late discovery of stakeholders is a common cause of rework. Identification starts now and continues throughout."],"q":"A project to replace a city's water billing system has just been chartered. The project manager has a list of stakeholders from the sponsor with eight names on it. What should the project manager do next?","rule":"Identify stakeholders early and keep doing it. Then analyze power, interest, and attitude."},{"id":"b1-P4-02","d":"P","t":4,"a":"hy","type":"s","o":["Arrange a one on one conversation to understand her concerns and find out how she prefers to be engaged","Continue sending status emails since she has not objected","Ask the sponsor to order her to attend","Remove her from the stakeholder register"],"c":[0],"x":["Silence from a high influence stakeholder is a warning. A direct conversation finds the reason and lets the project manager adjust the engagement approach.","No objection is not support. The current channel is clearly not working.","Forcing attendance does not create support and may harden resistance. Try direct engagement first.","Her influence on adoption has not changed. Removing her ignores a major risk."],"q":"A department head with high influence over a project's adoption has stopped coming to steering meetings and does not reply to status emails. She has not raised any objections. What should the project manager do?","rule":"High power stakeholders need active, personal engagement. Tailor the method to the person."},{"id":"b1-P4-03","d":"P","t":4,"a":"ag","type":"s","o":["Involved technicians as stakeholders in reviews and gathered their feedback during development","Written more detailed requirements at the start","Provided more training at release","Asked managers to mandate use of the tool"],"c":[0],"x":["The end users were never engaged. Frequent feedback from the people who will use the product is the point of iterative delivery.","Detailed upfront requirements from managers would carry the same blind spot.","Training cannot fix a product that does not fit the users' work.","A mandate produces compliance at best and leaves the value unrealized."],"q":"An agile team is building a scheduling tool for field technicians. Sprint reviews are attended only by managers, who approve each increment. After release, technicians refuse to use the tool because it does not fit how they work. What should the project manager have done?","rule":"Engage the people who will use the result, and do it during the work."},{"id":"b1-P4-04","d":"P","t":4,"a":"pr","type":"s","o":["Meet with the plant manager to learn the reasons for the resistance and look for ways the project can address them","Reduce the information sent to the plant manager to limit objections","Update the matrix to show the plant manager as neutral","Ask the team to work around the plant manager"],"c":[0],"x":["Moving a stakeholder from resistant to supportive starts with understanding their concerns and showing how the project handles them.","Less information increases distrust and gives the project manager no chance to answer concerns.","Changing the record does not change the stakeholder.","A resistant stakeholder with authority over the site can block the work. Avoidance raises the risk."],"q":"A stakeholder engagement assessment matrix shows that a plant manager is currently resistant and needs to be supportive for the project to succeed. Which action is most appropriate?","rule":"Close the gap between current and desired engagement by addressing the stakeholder's reasons."},{"id":"b1-P4-05","d":"P","t":4,"a":"hy","type":"s","o":["Review each stakeholder group's information needs and tailor the content, format, and frequency of communication","Add an executive summary page to the front of the report","Send the report twice a week so stakeholders see it more often","Ask executives to read the report more carefully"],"c":[0],"x":["Executives need a short summary and regulators need compliance detail. One report for everyone serves no one well.","This may help one group but still assumes one document fits forty stakeholders.","More of the same report does not fix the mismatch.","The communication is the project manager's responsibility. Blaming the reader does not solve it."],"q":"A project has forty stakeholders across regulators, customers, and internal departments. The project manager sends the same weekly twelve page status report to all of them. Several executives say they do not know the project's status. What should the project manager do?","rule":"Communication is tailored to the audience. Analyze needs first, then choose content and channel."},{"id":"b1-P4-06","d":"P","t":4,"a":"ag","type":"s","o":["Discuss the impact with the product owner and agree on how the team will get timely decisions, such as set availability or a delegate","Have the team lead act as product owner without telling anyone","Extend sprints to four weeks to allow more time for clarification","Escalate to the sponsor to have the product owner replaced"],"c":[0],"x":["The root cause is lack of access to the person who decides priority. The fix is an agreement with that person.","An unauthorized proxy has no mandate, and stakeholders may reject the results again.","Longer sprints delay feedback and do not make the product owner more available.","Escalation skips the direct conversation that should come first."],"q":"A product owner is often unavailable, and the team makes assumptions about priorities to keep working. Two sprint reviews have ended with rejected stories. What should the project manager do?","rule":"When a stakeholder's absence hurts the team, talk to the stakeholder and agree on a working arrangement."},{"id":"b1-P4-07","d":"P","t":4,"a":"pr","type":"m","o":["Report bad news promptly along with options for dealing with it","Follow through on commitments made in meetings","Share only positive progress until problems are fully solved","Agree to all stakeholder requests to show flexibility","Communicate only through formal written reports"],"c":[0,1],"x":["Stakeholders trust a project manager who tells them early and comes with a plan.","Reliability on small commitments is the basis for trust on large ones.","Hidden problems surface eventually, and the concealment damages trust more than the problem.","Agreeing to everything leads to missed commitments, which destroys trust.","Formal reports have a place, but trust is built through direct contact too."],"q":"Which two actions help a project manager build trust with stakeholders? (Choose two)","rule":"Trust comes from transparency and kept promises."},{"id":"b1-P5-01","d":"P","t":5,"a":"pr","type":"s","o":["Hold a meeting with both to walk through the schedule, explain what each milestone means, and agree on the dates that will be communicated","Send both the baseline schedule and let them sort it out","Compress the schedule to meet the March date","Tell the research director that March was never promised"],"c":[0],"x":["Their expectations differ because they understand the milestones differently. A facilitated review of the schedule aligns them before staff act on wrong dates.","The schedule alone has not prevented the misunderstanding so far. Facilitation is needed.","This changes the project to match one person's assumption without checking feasibility or approval.","This may be true, but it is confrontational and does not produce a shared understanding."],"q":"At the start of a laboratory fit out, the research director expects the lab to be usable in March. The facilities manager expects commissioning to run through May. Both have told their staff their own date. What should the project manager do?","rule":"Different expectations are aligned through facilitated discussion around shared facts."},{"id":"b1-P5-02","d":"P","t":5,"a":"ag","type":"s","o":["Facilitate a session with the product owner and the three managers to review capacity and agree on release priorities","Ask the team to increase velocity to fit all three","Let the product owner decide and announce the release content","Deliver a small part of each unit's features so everyone gets something"],"c":[0],"x":["The managers' expectations cannot all be met. Showing capacity and prioritizing together produces expectations everyone has heard and accepted.","Velocity measures what the team can do. Demanding more leads to quality problems and burnout.","The product owner does decide priority, but the expectations are already misaligned. The managers need to be part of the discussion to accept the result.","Splitting evenly may deliver nothing usable to anyone. Priority should follow value."],"q":"A product owner represents three business units. Each unit's manager believes its features will be in the first release. The team's velocity supports about one third of the combined requests. What should the project manager do?","rule":"Align expectations with transparent data and a facilitated conversation about priority."},{"id":"b1-P5-03","d":"P","t":5,"a":"hy","type":"s","o":["Keep them informed and consult them on matters that affect their work","Manage them closely with frequent one on one meetings","Monitor them with minimal effort","Keep them satisfied but avoid sharing details"],"c":[0],"x":["High interest and low power stakeholders want information and can provide useful detail. Keeping them informed maintains their support.","That level of effort is for high power, high interest stakeholders.","Minimal effort fits low power, low interest stakeholders. This group cares about the outcome.","Keep satisfied applies to high power, low interest stakeholders."],"q":"A project manager categorizes stakeholders by power and interest. A group of end users has low power and high interest. How should this group be handled?","rule":"Power and interest grid: high and high, manage closely. High power and low interest, keep satisfied. Low power and high interest, keep informed. Low and low, monitor."},{"id":"b1-P5-04","d":"P","t":5,"a":"pr","type":"s","o":["Set aside time to coach the coordinator through the situation, including how to clarify and document the client's expectations","Take over the client relationship until the delivery is complete","Tell the coordinator to follow the communications management plan","Suggest the coordinator take a course on stakeholder management"],"c":[0],"x":["Mentoring is part of the project manager's role. Coaching the coordinator solves the immediate problem and builds capability.","This removes a learning opportunity and adds to the project manager's load.","Pointing at a document gives no help in applying it to a difficult client.","A course may help later. The coordinator needs guidance on a live situation now."],"q":"A junior project coordinator asks the project manager how to handle a client who keeps changing what they expect from monthly reports. The project manager is busy with a critical delivery. What is the best response?","rule":"Project managers mentor. Make time for it, even under pressure."},{"id":"b1-P5-05","d":"P","t":5,"a":"ag","type":"s","o":["Present the forecast data and facilitate a discussion about which constraint can flex","Accept the constraints and ask the team to find a way","Tell the marketing lead the request is impossible and end the discussion","Agree in the workshop and raise a change request after the first sprint"],"c":[0],"x":["The expectation is unrealistic, and the data shows it. A facilitated trade-off discussion lets the stakeholder choose with full information.","Accepting an impossible commitment sets up failure and a loss of trust later.","The message is accurate, but it shuts down the conversation that would lead to a workable plan.","This is knowingly misleading the stakeholder."],"q":"During a release planning workshop, the marketing lead insists that a fixed launch date, full feature list, and current budget are all non-negotiable. The team's forecast shows all three cannot be met. What should the project manager do?","rule":"Do not accept commitments the data says are impossible. Show the data and facilitate the trade-off."},{"id":"b1-P6-01","d":"P","t":6,"a":"pr","type":"s","o":["Review the accepted design and requirements with the operations manager to understand the gap between what was approved and what is expected","Agree to the change to preserve the client relationship","Refuse because the design was approved","Submit a change request priced at standard rates"],"c":[0],"x":["Before any commercial discussion, the project manager needs to know whether this is a defect against approved requirements or a new expectation.","Giving away scope hides the cost and invites further unpaid changes.","The refusal may be contractually sound, but it skips understanding the need and damages the relationship.","A change request may follow, but only after the gap is understood."],"q":"A client accepted the design for a control panel two months ago. During factory testing, the client's new operations manager says the screen layout is not what operations expected and wants it changed at no cost. What should the project manager do first?","rule":"Understand the expectation gap first. Then decide whether it is a defect or a change."},{"id":"b1-P6-02","d":"P","t":6,"a":"ag","type":"s","o":["Talk with the customer to find out what is driving the scores and bring the findings to the product owner and team","Take no action, since delivery metrics are healthy","Stop collecting the scores because they do not reflect team performance","Ask the team to increase velocity to deliver more features"],"c":[0],"x":["Meeting sprint goals does not guarantee the customer is getting what they need. Direct feedback finds the cause.","Output metrics are not the same as customer value. A falling trend needs attention.","Removing the measure hides the problem.","More of what the customer is already unhappy with will not raise satisfaction."],"q":"Customer satisfaction scores collected after each sprint review have dropped for three sprints in a row. Velocity is steady and all sprint goals were met. What should the project manager do?","rule":"Monitor satisfaction as well as output. When they diverge, ask the customer."},{"id":"b1-P6-03","d":"P","t":6,"a":"hy","type":"s","o":["Work with the customer and sponsor to assess the gap against the intended outcome and agree on how to address it","Point out that all requirements were met and close the work","Ask the team to rebuild the module the way the customer now describes","Record the comment in lessons learned"],"c":[0],"x":["The project exists to deliver an outcome. When the deliverable meets the specification but misses the outcome, the gap has to be assessed with those who own the benefit.","Conformance to requirements is necessary, but the project is judged on the value it delivers.","Rework without analysis or approval is uncontrolled change.","The problem is live. Recording it for the future does not deal with it."],"q":"An internal customer tells the project manager that the delivered reporting module meets the written requirements but does not help her team make decisions faster, which was the reason for the project. What should the project manager do?","rule":"Success is measured by outcomes and value, and the specification is only the means."},{"id":"b1-P6-04","d":"P","t":6,"a":"pr","type":"s","o":["Explain the cumulative impact to the client and agree that all requests will go through the change control process","Continue accepting requests, since client satisfaction is the priority","Instruct the team to refuse all further requests from the client","Absorb the two weeks using management reserve"],"c":[0],"x":["Small unapproved additions are scope creep. The client needs to see the combined effect, and a controlled process keeps the relationship and the baseline intact.","The slipping schedule will hurt satisfaction more than a managed change process.","Refusal shuts out changes that may be valid and worth approving.","Management reserve is not for unapproved scope, and using it does not stop the creep."],"q":"A client sends the project manager frequent emails asking for small additions, each described as minor. The team has been doing them to keep the client happy, and the schedule has slipped two weeks. What should the project manager do?","rule":"Every change, however small, goes through change control. Show the customer the cumulative effect."},{"id":"b1-P6-05","d":"P","t":6,"a":"ag","type":"m","o":["Demonstrate working increments to the customer at regular intervals and collect feedback","Agree on a definition of done and acceptance criteria with the product owner","Delay customer involvement until the product is feature complete","Replace reviews with detailed written specifications","Let the team reorder the backlog based on technical interest"],"c":[0,1],"x":["Frequent demonstrations show the customer the real product and surface mismatches early.","Shared criteria make sure the team and customer mean the same thing by finished.","Late involvement is how expectation gaps grow unnoticed.","Documents cannot replace seeing the product and reacting to it.","Priority belongs to the product owner and is based on value to the customer."],"q":"Which two practices help an agile team keep delivery matched to customer expectations? (Choose two)","rule":"Short feedback loops and shared acceptance criteria keep expectations and delivery together."},{"id":"b1-P7-01","d":"P","t":7,"a":"pr","type":"s","o":["Arrange for her to work alongside other team members and document the system knowledge that is not written down","Ask her to write a manual before she leaves","Add a risk to the register and monitor it","Request a replacement engineer after she leaves"],"c":[0],"x":["Much of what she knows is tacit and transfers best by working together. Documentation captures what can be written.","A manual captures explicit knowledge only. The know-how built from experience will be lost.","The retirement is certain. The situation calls for action now.","A replacement starts with none of her knowledge, and the overlap period will be gone."],"q":"The only engineer who understands a legacy control system has announced she will retire in three months. The system is central to the project's integration work. What should the project manager do?","rule":"Tacit knowledge transfers through people working together. Start early."},{"id":"b1-P7-02","d":"P","t":7,"a":"ag","type":"s","o":["Help the team record improvement actions, assign owners, and review progress on them at the next retrospective","Cancel retrospectives since they are not producing change","Write up the problems personally and send them to management","Extend retrospectives to two hours to allow deeper discussion"],"c":[0],"x":["Lessons are only useful when they lead to action that is tracked. Owners and follow-up close the loop.","The event is sound. The missing piece is follow-through.","This takes ownership away from the team and turns a team improvement tool into a report.","Longer discussion without tracked actions repeats the same result."],"q":"An agile team finishes each sprint with a retrospective, but the same problems reappear every few sprints. Action items are noted on a whiteboard that is erased each time. What should the project manager do?","rule":"A lesson is learned only when behavior changes. Record it, own it, check it."},{"id":"b1-P7-03","d":"P","t":7,"a":"hy","type":"s","o":["Review past lessons during planning of each new project and make the repository searchable and accessible","Require longer lessons learned reports at project closure","Hold lessons learned sessions only on failed projects","Assign the PMO to read all past reports each year"],"c":[0],"x":["Knowledge has to be available and used. Building a review into planning makes reuse part of the process.","More content in a place nobody looks changes nothing.","Successful projects hold valuable practices too, and waiting for failure is late.","Annual reading by a third party does not reach teams when they are planning."],"q":"A company runs many similar projects, and each new team repeats mistakes earlier teams made. Lessons learned reports exist for past projects but are stored in closed project folders. What is the best improvement?","rule":"Lessons learned are an input to planning as well as an output of closing."},{"id":"b1-P7-04","d":"P","t":7,"a":"pr","type":"s","o":["Arrange handover sessions between the team's specialists and operations staff, and provide troubleshooting documentation before the team is released","Release the team as planned, since training was completed","Tell operations to call former team members when problems occur","Keep the whole team on the project for three more months"],"c":[0],"x":["Transition readiness includes the receiving group's ability to operate the product. Direct sessions with specialists cover the gaps formal training missed.","Completing a training activity is not the same as the operations group being ready.","Reassigned staff will have other priorities. This is not a reliable support arrangement.","This is costly and unapproved. A targeted handover addresses the need."],"q":"A project is closing and team members are being reassigned next week. The operations group that will own the new system has attended training but says it is unsure how to handle unusual faults. What should the project manager do?","rule":"Knowledge transfer is part of closure. Confirm the receiving group is ready before releasing the team."},{"id":"b1-P7-05","d":"P","t":7,"a":"ag","type":"m","o":["Pair programming or pairing on tasks","Rotating who works on which component over time","Assigning each component permanently to its most expert developer","Keeping design decisions in each developer's personal notes","Restricting access to the wiki to senior staff"],"c":[0,1],"x":["Working in pairs passes tacit knowledge directly and reduces reliance on any one person.","Planned rotation builds cross-functional skill and shared ownership of the code.","Permanent ownership creates knowledge silos and single points of failure.","Personal notes are not shared and leave with the person.","Restricting access blocks the people who most need the information."],"q":"Which two practices help spread knowledge inside an agile team? (Choose two)","rule":"Agile teams share knowledge by working together and rotating work. Avoid single points of knowledge."},{"id":"b1-P8-01","d":"P","t":8,"a":"pr","type":"s","o":["78","66","156","13"],"c":[0],"x":["With the project manager there are 13 people. Channels equal n times n minus 1, divided by 2, which is 13 times 12 divided by 2, or 78.","This is the result for 12 people. The question says to count the project manager, which makes 13.","This is 13 times 12 without dividing by 2. Each channel would be counted twice.","This is the number of people, not the number of channels between them."],"q":"A project manager joins a project with twelve stakeholders. How many potential communication channels exist, counting the project manager?","rule":"Channels equal n(n-1)/2. Read carefully to see whether the project manager is included in n."},{"id":"b1-P8-02","d":"P","t":8,"a":"hy","type":"s","o":["Apologize, brief the sponsor directly, and agree on how significant news will reach her in future","Point out that the delay was in the status report","Ask the colleague not to discuss the project with the sponsor","Increase the status report frequency to daily"],"c":[0],"x":["The report met the plan on paper but failed the sponsor. Significant bad news to a key stakeholder needs direct, timely contact, and the communication approach should be updated to reflect that.","Technically correct, but it blames the sponsor and leaves the communication gap in place.","Information will travel anyway. The fix is for the project manager to reach the sponsor first.","The problem was the channel for urgent news, not the reporting frequency."],"q":"A sponsor complains that she learned about a two week delay from a colleague in another department before hearing it from the project manager. The delay had been reported in the weekly status report three days earlier. What should the project manager do?","rule":"Push important news directly to the people who need it. Check that the communication worked."},{"id":"b1-P8-03","d":"P","t":8,"a":"ag","type":"s","o":["Agree with the team on one place to record decisions and keep information radiators such as the task board current and visible to all","Require all team members to be online during the same eight hours","Move all discussion to email so there is a formal record","Have the project manager summarize all chat threads each evening"],"c":[0],"x":["A single visible record of decisions and work status gives every time zone the same information without reading every thread.","This is impractical across distant time zones and harms sustainable pace.","Email is slower and just as scattered. It does not create one visible source.","This makes one person a bottleneck and delays information by up to a day."],"q":"A distributed agile team uses chat for most discussion. Decisions made in chat are scattered across threads, and team members in other time zones miss them. What should the project manager suggest?","rule":"Agile communication favors transparency: visible, shared, current information that anyone can pull."},{"id":"b1-P8-04","d":"P","t":8,"a":"pr","type":"s","o":["A call or meeting with the client, followed by written confirmation of the facts and the recovery plan","A detailed email sent late on Friday","A note in the next monthly report","A message passed through the client's procurement clerk"],"c":[0],"x":["Sensitive news is best delivered interactively so questions can be answered at once. Written follow-up provides the record.","Email is one-way for a message that will raise questions, and the timing looks evasive.","A four week delay on a key delivery should not wait for a scheduled report or be buried in one.","Passing bad news through an intermediary risks distortion and damages trust."],"q":"A project manager must tell a client that a key delivery will be four weeks late because of a supplier failure. The client contact is known to react strongly to bad news. Which communication method is best?","rule":"Match the method to the message. Difficult news goes in person or by call, then in writing."},{"id":"b1-P8-05","d":"P","t":8,"a":"hy","type":"s","o":["Ask the committee what they need to see, then restructure the update and confirm understanding at each meeting","Send the same update weekly so members get used to it","Add more technical detail so nothing can be missed","Record in the minutes that the information was provided"],"c":[0],"x":["Sending information is not the same as communicating it. A feedback loop checks that the message was received and understood.","Repeating a format that is not understood does not help.","More detail makes the main message harder to find.","This protects the project manager but leaves the committee uninformed."],"q":"A project manager sends a detailed technical update to the steering committee every two weeks. At the last meeting it became clear that several members had not understood that the project was forecasting a budget overrun. What should the project manager do?","rule":"Communication includes confirming the receiver understood. Build in feedback."},{"id":"b1-P8-06","d":"P","t":8,"a":"pr","type":"match","left":["Push communication","Pull communication","Interactive communication","Formal written","Informal verbal"],"right":["An email with the monthly report sent to a distribution list","A project dashboard that stakeholders open when they want information","A video call to work through a design issue","A contract amendment","A conversation in the hallway about a test result"],"q":"Match each communication type to its example.","why":"Push sends information to specific people without confirming receipt. Pull lets large audiences fetch information when needed. Interactive is real time and multidirectional, which suits complex or sensitive topics. Formal written is used for contracts, plans, and anything with legal weight.","rule":"Choose the method by the message: interactive for complex or sensitive, push for specific recipients, pull for large audiences."},{"id":"b1-R1-01","d":"R","t":1,"a":"hy","type":"s","o":["A hybrid approach, with predictive planning for the regulatory part and iterative delivery for the interface","A fully predictive approach, because regulatory work is involved","A fully agile approach, because customers are involved","Whichever approach the team used on its last project"],"c":[0],"x":["The two parts have different levels of uncertainty. Matching the approach to each part gives control where requirements are fixed and feedback where they are not.","The interface requirements are expected to change. A full upfront plan for them would need constant rework.","The regulatory part has fixed requirements and compliance deliverables that suit upfront planning.","The approach is chosen by the characteristics of the work, such as uncertainty and delivery needs."],"q":"A company is starting a project to build a customer portal. The regulatory reporting part has fixed, well understood requirements. The user interface requirements are unclear and expected to change as customers try it. Which development approach should the project manager recommend?","rule":"Choose the approach by requirement stability and delivery needs. Different parts of one project can use different approaches."},{"id":"b1-R1-02","d":"R","t":1,"a":"pr","type":"s","o":["Review the plans together with the leads, resolve the conflict, and update the integrated project management plan","Approve the plans as submitted, since each lead owns their area","Change the schedule to month 8 without telling the schedule lead","Raise a risk about late equipment delivery"],"c":[0],"x":["Integration is the project manager's job. The plans must be consistent with each other before they are baselined.","The plans contradict each other. Approving them builds a known failure into the baseline.","The fix might be right, but resolving it alone skips the people who know the options, such as expediting.","This is a planning error that can be fixed now, not an uncertain event."],"q":"A project manager has subsidiary plans for scope, schedule, cost, and procurement, each written by a different lead. The procurement plan assumes long lead equipment arrives in month 8. The schedule shows installation of that equipment starting in month 6. What should the project manager do?","rule":"The project manager integrates. Check subsidiary plans against each other for gaps and conflicts."},{"id":"b1-R1-03","d":"R","t":1,"a":"ag","type":"s","o":["Planning happens throughout, with a high level roadmap up front and detailed planning for each release and iteration","Very little, because agile teams respond to change instead of following a plan","The same detailed upfront plan as a predictive project, updated each sprint","Only the product owner plans, and the team executes"],"c":[0],"x":["Agile uses progressive elaboration. Near term work is planned in detail, and later work is kept at a higher level until more is known.","Agile teams plan often. They simply avoid detailed plans for work that is far away and uncertain.","A detailed upfront plan for uncertain work is waste, because much of it will change.","The team takes part in release and iteration planning, including estimating and committing to work."],"q":"An organization new to agile asks the project manager how much planning an agile project needs. Which answer is best?","rule":"Agile planning is continuous and layered: roadmap, release, iteration, day."},{"id":"b1-R1-04","d":"R","t":1,"a":"pr","type":"s","o":["A rough order of magnitude estimate with a stated range and the assumptions behind it","A definitive estimate based on a bottom up calculation","A single figure with no range, so the sponsor has a clear number","No estimate until the scope is fully defined"],"c":[0],"x":["Early in a project with little information, a wide range is honest and appropriate. Stating assumptions lets the sponsor judge the estimate's reliability.","Bottom up estimating needs a detailed work breakdown that does not exist yet.","A single number hides the uncertainty and is likely to be treated as a commitment.","The sponsor needs a number to make the go or no-go decision. A range serves that need."],"q":"While estimating a new type of project, the team has no historical data and the scope is defined only at a high level. The sponsor asks for a cost estimate to decide whether to proceed. What should the project manager provide?","rule":"Estimate accuracy follows information. Early estimates are ranges, with assumptions stated."},{"id":"b1-R1-05","d":"R","t":1,"a":"hy","type":"s","o":["Work with the design leads to add the sustainability requirements into scope, quality, and procurement planning","Leave them out, since the design leads did not raise them","Address them at commissioning when energy use can be measured","Ask the owner to waive the policy for this project"],"c":[0],"x":["Sustainability requirements are project requirements. They need to be planned into the work from the start, where they cost the least to address.","The owner's policy makes them a requirement. Missing them means nonconforming deliverables.","By commissioning, design choices are fixed and changes are very expensive.","There is no basis for a waiver. The project manager's job is to plan for the requirement."],"q":"A project plan for a new facility includes energy use targets set by the owner's sustainability policy. During planning, the project manager notices that none of the design work packages account for them. What should the project manager do?","rule":"Identify critical information requirements such as sustainability during planning and build them into the integrated plan."},{"id":"b1-R1-06","d":"R","t":1,"a":"ag","type":"s","o":["About 12 sprints, or roughly 24 weeks, presented as a forecast that will be updated as velocity data comes in","Exactly 24 weeks, which can be given as a committed date","It cannot be estimated because agile projects have no end date","About 6 sprints, if the team works overtime"],"c":[0],"x":["300 divided by 25 is 12 sprints. It is a forecast based on empirical velocity, so it should be updated each sprint.","Velocity varies and backlogs change. Presenting a forecast as a commitment misuses the data.","Velocity and backlog size exist precisely to allow forecasting.","Doubling output with overtime is not sustainable and is not how agile forecasts are made."],"q":"An agile team has a product backlog of 300 story points and an average velocity of 25 points per two week sprint. The product owner asks when the backlog could be complete, assuming no scope change. What is the best answer?","rule":"Forecast with backlog size divided by velocity. Present it as a forecast and refresh it."},{"id":"b1-R1-07","d":"R","t":1,"a":"pr","type":"m","o":["Scope baseline","Change management plan","Risk register","Issue log","Lessons learned register"],"c":[0,1],"x":["The scope baseline, consisting of the scope statement, WBS, and WBS dictionary, is a component of the project management plan.","The change management plan is a subsidiary part of the project management plan.","The risk register is a project document that is updated often without formal change control on the plan.","The issue log is a project document.","The lessons learned register is a project document."],"q":"Which two items are part of the project management plan and not project documents? (Choose two)","rule":"The plan holds baselines and management plans. Registers and logs are project documents."},{"id":"b1-R1-08","d":"R","t":1,"a":"hy","type":"s","o":["Assess the impact on the project's plan, dependencies, and business value, then bring options to the sponsor","Continue as planned and address the interface when the team reaches that work","Add the interface to the project scope and start work","Ask the sponsor to cancel this project too"],"c":[0],"x":["A dependency has disappeared. The project manager evaluates the effect on the integrated plan and on whether the project still delivers value before recommending a path.","Ignoring a known gap lets the team build toward something that may not work.","This is a scope addition without analysis or approval.","Cancellation may be an option, but only after the impact is assessed."],"q":"Halfway through a project, the project manager learns that a related project has been cancelled. That project was going to supply a data interface this project depends on. What should the project manager do first?","rule":"Assess first, then recommend. Check dependencies and continued business value when conditions change."},{"id":"b1-R2-01","d":"R","t":2,"a":"pr","type":"s","o":["Create a work breakdown structure by decomposing deliverables into work packages","Develop the project schedule","Start the procurement process","Collect requirements"],"c":[0],"x":["The WBS breaks the scope into work packages that can be estimated, scheduled, and assigned. It follows the scope statement.","The schedule is built from activities, which come from work packages. The WBS comes first.","Procurement decisions depend on knowing the work packages and make or buy analysis.","Requirements are collected before the scope statement is written."],"q":"A project team has a signed scope statement. The project manager now wants to make sure all the work is identified and can be estimated and assigned. What should the team do next?","rule":"Order: requirements, scope statement, WBS, then activities and schedule. The WBS contains 100 percent of the work."},{"id":"b1-R2-02","d":"R","t":2,"a":"ag","type":"s","o":["The product owner and team refine the item, splitting it into smaller stories with acceptance criteria","The team estimates it at the maximum point value and starts work","The project manager writes a detailed specification for the module","The sprint is extended until the module is complete"],"c":[0],"x":["Backlog refinement breaks large items into stories small enough to estimate and complete in one iteration.","A large unclear item cannot be finished in a sprint and gives no usable increment.","Defining the product is the product owner's work, done with the team.","Sprints are fixed length. Changing the timebox to fit the work defeats its purpose."],"q":"A product owner has written a backlog item that reads: build the reporting module. The team says it is too large to estimate or finish in a sprint. What should happen?","rule":"Large backlog items are split during refinement. Stories must be small, clear, and testable."},{"id":"b1-R2-03","d":"R","t":2,"a":"pr","type":"s","o":["The team's check is quality control, and the customer's sign-off is scope validation","Both activities are scope validation","The team's check is scope validation, and the customer's sign-off is quality assurance","Both activities are quality control"],"c":[0],"x":["Control quality checks that the deliverable is correct. Validate scope is the formal acceptance of the deliverable by the customer. Quality control usually comes first.","The internal check against specifications is a quality control activity.","The terms are reversed and quality assurance is about the process, not acceptance.","Customer acceptance is validate scope, which is separate from checking correctness."],"q":"A customer inspects a completed pump skid and signs the acceptance form. Before the inspection, the project team checked the skid against the specifications and test procedures. Which statement describes these two activities?","rule":"Control quality means correctness, done by the team. Validate scope means acceptance, done by the customer."},{"id":"b1-R2-04","d":"R","t":2,"a":"hy","type":"s","o":["As gold plating, which should be avoided because it adds unapproved scope and risk","As good customer service that should be encouraged","As acceptable because it took less t
